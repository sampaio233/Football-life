  MC:{ shortPass:.20, vision:.18, ballControl:.15, decisionMaking:.15, stamina:.12, longPass:.12, teamwork:.08 },
  MEIA:{ vision:.18, dribbling:.16, shortPass:.16, ballControl:.15, finishing:.14, composure:.11, agility:.10 },
  PD:{ pace:.20, dribbling:.20, crossing:.15, ballControl:.15, finishing:.15, agility:.15 },
  PE:{ pace:.20, dribbling:.20, crossing:.15, ballControl:.15, finishing:.15, agility:.15 },
  SA:{ finishing:.20, dribbling:.16, positioning:.16, ballControl:.14, pace:.14, composure:.10, vision:.10 },
  CA:{ finishing:.26, positioning:.20, composure:.16, heading:.14, strength:.12, ballControl:.12 },
};
function getAttr(p,key){
  if(key in p.attributes.physical) return p.attributes.physical[key];
  if(key in p.attributes.technical) return p.attributes.technical[key];
  return p.attributes.mental[key];
}
function setAttr(p,key,value){
  // Guarda o valor com casas decimais de verdade — arredondar aqui era o bug que travava
  // qualquer evolução de treino pequena (ganhos de 0.1-0.5 nunca se acumulavam). O arredondamento
  // acontece só na hora de EXIBIR o atributo pro jogador (ver formatAttrDisplay).
  const v = Math.min(99, Math.max(1, value));
  if(key in p.attributes.physical) p.attributes.physical[key]=v;
  else if(key in p.attributes.technical) p.attributes.technical[key]=v;
  else p.attributes.mental[key]=v;
}
function formatAttrDisplay(value){ return Math.round(value); }
function calculateOverall(position, attributes){
  const weights = POSITION_WEIGHTS[position];
  let total=0, weightSum=0;
  for(const key in weights){
    total += getAttr({attributes}, key) * weights[key];
    weightSum += weights[key];
  }
  return Math.round(Math.min(100, Math.max(1, total/weightSum)));
}

function generateHiddenPotential(){
  const roll = Math.random();
  if(roll<0.35) return rand(72,80);
  if(roll<0.65) return rand(81,86);
  if(roll<0.85) return rand(87,91);
  if(roll<0.96) return rand(92,96);
  if(roll<0.995) return rand(97,99);
  return 100;
}

function generateInitialAttributes(position){
  const weights = POSITION_WEIGHTS[position];
  const base = () => ({
    physical:{ pace:rand(45,65), acceleration:rand(45,65), strength:rand(40,60), jumping:rand(40,60), stamina:rand(45,65), agility:rand(45,65), balance:rand(45,65) },
    technical:{ finishing:rand(35,55), shortPass:rand(40,60), longPass:rand(35,55), dribbling:rand(40,60), ballControl:rand(40,60), crossing:rand(30,50), heading:rand(35,55), freeKick:rand(25,50), penalty:rand(30,55), marking:rand(30,55), tackling:rand(30,55) },
    mental:{ vision:rand(35,55), positioning:rand(35,55), composure:rand(35,55), determination:rand(45,65), leadership:rand(25,50), concentration:rand(35,55), decisionMaking:rand(35,55), discipline:rand(40,65), teamwork:rand(40,60) },
  });
  let attributes = base();
  for(let i=0;i<40;i++){
    const overall = calculateOverall(position, attributes);
    if(overall>=58 && overall<=65) break;
    const delta = overall<58 ? 1 : -1;
    for(const key in weights){
      const p = {attributes};
      setAttr(p, key, getAttr(p,key)+delta);
    }
  }
  return attributes;
}

// Determina se o jogador é titular, banco (entra no 2º tempo) ou nem é relacionado nessa rodada —
// comparando o overall (ajustado por confiança do treinador e moral) com a concorrência na posição.
function determineMatchRole(player){
  const samePos = (player.squad||[]).filter(t=>t.position===player.position);
  if(samePos.length===0) return "titular";
  const slot = SQUAD_TEMPLATE.find(s=>s.position===player.position);
  const slotCount = slot ? slot.count : 2;
  const startersNeeded = Math.max(1, Math.ceil(slotCount/2));
  const formBonus = (player.coachTrust-50)/10 + (player.morale-50)/25;
  const effectiveOverall = player.overall + formBonus;
  const betterCount = samePos.filter(t=>t.overall > effectiveOverall).length;
  if(betterCount < startersNeeded) return "titular";
  if(betterCount < startersNeeded+2) return "banco";
  return "fora";
}

// CALENDÁRIO E CLASSIFICAÇÃO — adversários REAIS da liga (round-robin)
// ============================================================
const SEASON_MATCH_COUNT = 12; // com 13 times (round-robin ímpar), cada um joga 12 partidas + 1 rodada de folga

// Ligas com temporada completa (turno e returno) cadastradas de verdade — hoje só o Brasileirão Série A.
// Outras ligas seguem no formato reduzido (12 jogos) até ganharem elenco completo cadastrado.
const FULL_SEASON_LEAGUES = { "Brasileirão Série A": 20 };

function pickLeagueTeams(playerClub, forceQuickMode){
  // Nunca mistura clubes de ligas diferentes (Série A não joga contra Série B).
  const sameLeague = clubsByLeague(playerClub.league, playerClub.id);
  const fullSize = FULL_SEASON_LEAGUES[playerClub.league];
  if(fullSize && !forceQuickMode && sameLeague.length+1===fullSize){
    // Temporada completa: todos os clubes cadastrados da liga, turno e returno.
    return { teams: [playerClub, ...sameLeague], reduced:false, full:true };
  }
  const shuffled = [...sameLeague].sort(()=>Math.random()-0.5).slice(0,12);
  const reduced = shuffled.length < 12;
  return { teams: [playerClub, ...shuffled], reduced, full:false };
}

// Método do círculo: N times (par, com "bye" se ímpar) -> N-1 rodadas.
function roundRobin(teamsIn){
  const teams = [...teamsIn];
  if(teams.length % 2 !== 0) teams.push(null); // bye
  const n = teams.length;
  const arr = [...teams];
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const roundMatches = [];
    for(let i=0;i<n/2;i++){
      const home = arr[i], away = arr[n-1-i];
      if(home && away){
        // alterna mando de campo por rodada para não ficar sempre o mesmo time em casa
        if(r%2===0) roundMatches.push({home,away});
        else roundMatches.push({home:away,away:home});
      }
    }
    rounds.push(roundMatches);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}

// Turno e returno completo (pontos corridos "de verdade", tipo Brasileirão): N times, N par,
// N-1 rodadas no turno + as mesmas N-1 rodadas de novo no returno com mando invertido = 2N-2 rodadas,
// cada dupla se enfrentando exatamente duas vezes (uma em casa, uma fora).
function doubleRoundRobin(teamsIn){
  const n = teamsIn.length;
  if(n % 2 !== 0) throw new Error("doubleRoundRobin exige número par de times");
  const arr = [...teamsIn];
  const turno = [];
  for(let r=0;r<n-1;r++){
    const roundMatches = [];
    for(let i=0;i<n/2;i++){
      roundMatches.push({ home:arr[i], away:arr[n-1-i] });
    }
    turno.push(roundMatches);
    arr.splice(1,0,arr.pop());
  }
  const returno = turno.map(round => round.map(m => ({ home:m.away, away:m.home })));
  return [...turno, ...returno];
}

function buildCalendar(playerClub, forceQuickMode){
  const { teams, reduced, full } = pickLeagueTeams(playerClub, forceQuickMode);
  const rounds = full ? doubleRoundRobin(teams) : roundRobin(teams);
  const standings = {};
  teams.forEach(t=>{ standings[t.id] = { club:t, j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0 }; });
  const matchesTotal = full ? (teams.length-1)*2 : teams.length-1;
  return { league: playerClub.league, teams, rounds, standings, round: 0, matchesTotal, reduced, full };
}

function findPlayerFixture(calendar, playerClubId, roundIdx){
  const round = calendar.rounds[roundIdx];
  if(!round) return null;
  return round.find(m => m.home.id===playerClubId || m.away.id===playerClubId) || null;
}

// Simula rapidamente um confronto entre dois clubes (usado para times que não são o do jogador).
function quickSimResult(home, away){
  const homeStrength = home.squadQuality*0.6 + home.reputation*0.4 + 6; // vantagem de mando
  const awayStrength = away.squadQuality*0.6 + away.reputation*0.4;
  const diff = (homeStrength - awayStrength) / 12;
  const homeGoals = Math.max(0, Math.round(rand(0,2) + diff*0.6 + (Math.random()<0.28?1:0)));
  const awayGoals = Math.max(0, Math.round(rand(0,2) - diff*0.6 + (Math.random()<0.22?1:0)));
  return { homeGoals, awayGoals };
}

function applyResultToStandings(standings, home, away, homeGoals, awayGoals){
  const h = standings[home.id], a = standings[away.id];
  if(!h || !a) return;
  h.j++; a.j++;
  h.gp += homeGoals; h.gc += awayGoals;
  a.gp += awayGoals; a.gc += homeGoals;
  if(homeGoals>awayGoals){ h.v++; h.pts+=3; a.d++; }
  else if(homeGoals<awayGoals){ a.v++; a.pts+=3; h.d++; }
  else { h.e++; a.e++; h.pts++; a.pts++; }
}

// Simula todos os confrontos de uma rodada, exceto o do clube informado (que é resolvido separadamente pela partida interativa).
function simulateRoundExceptClub(calendar, roundIdx, skipClubId){
  const round = calendar.rounds[roundIdx];
  if(!round) return;
  round.forEach(m=>{
    if(m.home.id===skipClubId || m.away.id===skipClubId) return;
    const res = quickSimResult(m.home, m.away);
    applyResultToStandings(calendar.standings, m.home, m.away, res.homeGoals, res.awayGoals);
  });
}

// Placar ao vivo dos outros jogos da rodada (ticker visível durante a partida do jogador).
function buildLiveOtherGames(calendar, roundIdx, skipClubId){
  const round = calendar.rounds[roundIdx];
  if(!round) return [];
  return round.filter(m=>m.home.id!==skipClubId && m.away.id!==skipClubId)
    .map(m=>({ home:m.home, away:m.away, homeGoals:0, awayGoals:0, minute:0, finished:false }));
}
function tickOtherGames(games, currentMinute){
  return games.map(g=>{
    if(g.finished) return { ...g, minute:currentMinute };
    const next = { ...g, minute:currentMinute };
    const homeChance = (g.home.squadQuality*0.6+g.home.reputation*0.4+5)/900;
    const awayChance = (g.away.squadQuality*0.6+g.away.reputation*0.4)/900;
    if(Math.random()<homeChance) next.homeGoals += 1;
    if(Math.random()<awayChance) next.awayGoals += 1;
    if(currentMinute>=90) next.finished = true;
    return next;
  });
}

function sortedStandings(calendar){
  return Object.values(calendar.standings).sort((a,b)=> (b.pts-a.pts) || ((b.gp-b.gc)-(a.gp-a.gc)) || (b.gp-a.gp));
}

const SOUTH_AMERICA = ["brasil","argentina","uruguai","chile"];
const EUROPE = ["portugal","espanha","inglaterra","alemanha","italia","franca"];
function continentPool(countryId){
  if(SOUTH_AMERICA.includes(countryId)) return SOUTH_AMERICA;
  if(EUROPE.includes(countryId)) return EUROPE;
  return [countryId];
}
function cupRoundName(teamsInRound){
  if(teamsInRound<=2) return "Final";
  if(teamsInRound<=4) return "Semifinal";
  if(teamsInRound<=8) return "Quartas de final";
  return "Oitavas de final";
}
function buildCup(name, poolTeams, playerClub, maxSize){
  const others = poolTeams.filter(t=>t.id!==playerClub.id);
  const shuffled = [...others].sort(()=>Math.random()-0.5);
  const total = Math.min(maxSize||8, shuffled.length+1);
  let pow=1; while(pow*2<=total) pow*=2;
  const chosenOthers = shuffled.slice(0, pow-1);
  const teams = [playerClub, ...chosenOthers].sort(()=>Math.random()-0.5);
  const round1 = [];
  for(let i=0;i<teams.length;i+=2) round1.push({ home:teams[i], away:teams[i+1], resolved:false, winner:null, homeGoals:null, awayGoals:null });
  const roundsCount = Math.log2(teams.length);
  return { name, teams, rounds:[round1], currentRoundIdx:0, roundsCount, eliminated:false, champion:null, playerClubId:playerClub.id, scheduledWeeks:[], playerGoals:0, playerAssists:0 };
}
function scheduleCupWeeks(cup, totalLeagueWeeks, offset){
  offset = offset || 0;
  const weeks = [];
  for(let i=1;i<=cup.roundsCount;i++){
    let w = Math.round((totalLeagueWeeks*i)/(cup.roundsCount+1)) + offset;
    if(w%2!==0) w+=1;
    if(w<2) w=2;
    weeks.push(w);
  }
  return { ...cup, scheduledWeeks:weeks };
}
function resolveCupTie(tie){
  if(tie.resolved) return tie;
  const res = quickSimResult(tie.home, tie.away);
  let winner;
  if(res.homeGoals>res.awayGoals) winner=tie.home;
  else if(res.awayGoals>res.homeGoals) winner=tie.away;
  else winner = (tie.home.squadQuality+tie.home.reputation) >= (tie.away.squadQuality+tie.away.reputation) ? tie.home : (Math.random()<0.5?tie.home:tie.away);
  return { ...tie, resolved:true, winner, homeGoals:res.homeGoals, awayGoals:res.awayGoals };
}
function findPlayerCupTie(cup){
  if(!cup || cup.eliminated || cup.champion) return null;
  const round = cup.rounds[cup.currentRoundIdx];
  return round.find(t=>t.home.id===cup.playerClubId || t.away.id===cup.playerClubId) || null;
}
function advanceCup(cup, playerWon, playerClub, opponentClub){
  const round = cup.rounds[cup.currentRoundIdx].map(t=>{
    if(t.home.id===cup.playerClubId || t.away.id===cup.playerClubId){
      return { ...t, resolved:true, winner: playerWon?playerClub:opponentClub };
    }
    return resolveCupTie(t);
  });
  const updatedRounds = [...cup.rounds.slice(0,-1), round];
  if(!playerWon) return { ...cup, rounds:updatedRounds, eliminated:true };
  const winners = round.map(t=>t.winner);
  if(winners.length===1) return { ...cup, rounds:updatedRounds, champion:winners[0] };
  const nextRound = [];
  for(let i=0;i<winners.length;i+=2) nextRound.push({ home:winners[i], away:winners[i+1], resolved:false, winner:null, homeGoals:null, awayGoals:null });
  return { ...cup, rounds:[...updatedRounds, nextRound], currentRoundIdx:cup.currentRoundIdx+1 };
}

const DIVISION_LINKS = {
  "Brasileirão Série A": { down:"Brasileirão Série B", relegationSpots:4 },
  "Brasileirão Série B": { up:"Brasileirão Série A", promotionSpots:4 },
};
// Zona de classificação continental: melhores colocados da temporada, além do critério de reputação já existente.
const CONTINENTAL_QUALIFICATION_SPOTS = 4;

function applyLeagueOutcome(player, calendar, season){
  const standings = sortedStandings(calendar);
  const position = standings.findIndex(s=>s.club.id===player.club.id) + 1;
  const totalTeams = standings.length;
  let updated = player;
  let divisionChanged = null;

  const link = DIVISION_LINKS[player.club.league];
  if(link && link.down && position > totalTeams - link.relegationSpots){
    const newClub = { ...player.club, league:link.down, tier: player.club.tier==="grande"?"medio":"pequeno" };
    updated = { ...updated, club:newClub };
    updated = addMilestone(updated, `Rebaixado: ${player.club.name} cai para a ${link.down} após terminar em ${position}º lugar.`, season, "rebaixamento");
    const news = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"sensacionalista",
      headline:`Queda! ${player.club.name} é rebaixado para a ${link.down}`,
      summary:`Time termina a temporada em ${position}º lugar e amarga o rebaixamento.`, date:`Temporada ${season}`, impact:-18, season };
    updated = { ...updated, newsLog:[news, ...updated.newsLog].slice(0,40) };
    divisionChanged = "rebaixado";
  } else if(link && link.up && position <= link.promotionSpots){
    const newClub = { ...player.club, league:link.up, tier: player.club.tier==="pequeno"?"medio":player.club.tier };
    updated = { ...updated, club:newClub };
    updated = addMilestone(updated, `Acesso! ${player.club.name} sobe para a ${link.up} após terminar em ${position}º lugar.`, season, "acesso");
    const news = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"nacional",
      headline:`Acesso garantido! ${player.club.name} sobe para a ${link.up}`,
      summary:`Campanha de ${position}º lugar garante o retorno à elite do futebol nacional.`, date:`Temporada ${season}`, impact:20, season };
    updated = { ...updated, newsLog:[news, ...updated.newsLog].slice(0,40) };
    divisionChanged = "promovido";
  }

  const qualifiedForContinental = !divisionChanged && position <= CONTINENTAL_QUALIFICATION_SPOTS;
  if(qualifiedForContinental){
    updated = addMilestone(updated, `Classificação confirmada para a competição continental, terminando em ${position}º lugar.`, season, "classificação");
  }

  return { player:updated, position, totalTeams, divisionChanged, qualifiedForContinental };
}

// Fecha a temporada (evolução, prêmios, seleção, acesso/rebaixamento, novo calendário e copas).
// Compartilhado entre a partida normal e os avanços automáticos de semana (lesão/suspensão),
// para a temporada nunca ficar travada esperando uma partida que o jogador não pode disputar.
function finishSeason(career, updatedPlayer, nextSeasonProgress){
  const evo = applySeasonEvolution(updatedPlayer, nextSeasonProgress, career.currentCoach.trainingQuality);
  const seasonRecord = { season:career.currentSeason, clubId:updatedPlayer.club.id, matches:nextSeasonProgress.matchesPlayed, goals:nextSeasonProgress.goals,
    assists:nextSeasonProgress.assists, saves:nextSeasonProgress.saves||0, cleanSheets:nextSeasonProgress.cleanSheets||0, averageRating:Math.round((evo.averageRating||0)*10)/10, yellowCards:nextSeasonProgress.yellowCards,
    redCards:nextSeasonProgress.redCards, injuries:nextSeasonProgress.injuriesThisSeason, titles:[], overallStart:nextSeasonProgress.overallAtStart,
    overallEnd:evo.overallAfter, marketValue:Math.round(evo.overallAfter*40000*(evo.player.age<=23?1.4:1)) };
  const seasonNews = newsFromSeasonEnd(evo.player, career.currentSeason, evo.overallAfter-evo.overallBefore);
  let finalPlayer = { ...evo.player, energy:100, morale:Math.min(100, evo.player.morale+8), seasons:[...evo.player.seasons, seasonRecord], newsLog:[seasonNews, ...evo.player.newsLog].slice(0,40) };

  const awards = computeSeasonAwards(finalPlayer, seasonRecord, career.calendar);
  if(awards.length>0){
    finalPlayer = { ...finalPlayer, achievements:[...finalPlayer.achievements, ...awards.map(a=>({...a, season:career.currentSeason}))] };
    awards.forEach(a=>{ finalPlayer = addMilestone(finalPlayer, `${a.title}: ${a.description}`, career.currentSeason, "prêmio"); });
  }

  let leagueOutcome = { position:null, totalTeams:null, divisionChanged:null, qualifiedForContinental:false };
  if(!evo.retirementSuggested){
    leagueOutcome = applyLeagueOutcome(finalPlayer, career.calendar, career.currentSeason);
    finalPlayer = leagueOutcome.player;
  }

  const transferOffers = evo.retirementSuggested ? [] : generateTransferOffers(finalPlayer, finalPlayer.club);
  const nextCalendar = evo.retirementSuggested ? career.calendar : buildCalendar(finalPlayer.club, career.quickMode);
  let nextCup = career.cup, nextContinentalCup = career.continentalCup;
  const totalLeagueWeeks = nextCalendar.rounds.length*2;
  if(!evo.retirementSuggested){
    const built = buildSeasonCups(finalPlayer.club, leagueOutcome.qualifiedForContinental);
    nextCup = scheduleCupWeeks(built.cup, totalLeagueWeeks, 0);
    nextContinentalCup = built.continentalCup ? scheduleContinentalWeeks(built.continentalCup, totalLeagueWeeks, 4) : null;
  }

  let nextNationalTeam = career.nationalTeam || null;
  let nextWorldCup = career.worldCup && !career.worldCup.champion && !career.worldCup.eliminated ? career.worldCup : null;
  let nextWorldCupSeason = career.nextWorldCupSeason || 5; // primeira Copa do Mundo na temporada 5, tempo de virar referência na seleção
  const upcomingSeason = career.currentSeason+1;
  if(!evo.retirementSuggested && !nextWorldCup && upcomingSeason>=nextWorldCupSeason && finalPlayer.age>=18 && finalPlayer.reputation.national>=50){
    nextWorldCup = scheduleContinentalWeeks(buildWorldCup(finalPlayer, upcomingSeason), totalLeagueWeeks, 12);
    nextWorldCupSeason = upcomingSeason+4;
    finalPlayer = addMilestone(finalPlayer, `Convocado para defender a seleção na Copa do Mundo!`, upcomingSeason, "seleção");
    const wcCallUpNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"nacional",
      headline:`${finalPlayer.firstName} ${finalPlayer.lastName} está na lista para a Copa do Mundo!`,
      summary:`O país sonha alto e o jovem atleta será uma das esperanças na competição.`, date:`Temporada ${upcomingSeason}`, impact:25, season:upcomingSeason };
    finalPlayer = { ...finalPlayer, newsLog:[wcCallUpNews, ...finalPlayer.newsLog].slice(0,40) };
  } else if(upcomingSeason>=nextWorldCupSeason && !nextWorldCup){
    // Não foi convocado desta vez — a janela se abre de novo no próximo ciclo.
    nextWorldCupSeason = upcomingSeason+4;
  }
  if(!evo.retirementSuggested && !nextWorldCup && (!nextNationalTeam || nextNationalTeam.matchesRemaining<=0)){
    const callUp = checkNationalCallUp(finalPlayer, career.currentSeason, totalLeagueWeeks);
    finalPlayer = callUp.player;
    if(callUp.called) nextNationalTeam = callUp.nationalTeam;
  }

  const newCareer = { ...career, player:finalPlayer, weekIndex:0,
    currentSeason: evo.retirementSuggested ? career.currentSeason : career.currentSeason+1,
    seasonProgress:{ matchesPlayed:0, matchesTotal:nextCalendar.matchesTotal, goals:0, assists:0, saves:0, cleanSheets:0, cupGoals:0, cupAssists:0, ratingSum:0, yellowCards:0, redCards:0, injuriesThisSeason:0, overallAtStart:evo.overallAfter },
    calendar: nextCalendar, cup:nextCup, continentalCup:nextContinentalCup, nationalTeam:nextNationalTeam,
    worldCup:nextWorldCup, nextWorldCupSeason, retired:evo.retirementSuggested, retirementReason:evo.retirementReason };

  return { newCareer, screen: evo.retirementSuggested ? "retirement" : "season-summary", transferOffers };
}

// ============================================================
// LIBERTADORES / COPA CONTINENTAL — fase de grupos + final
// (versão reduzida do formato real: grupo de 4 times, os 2 melhores decidem o título)
// ============================================================
// Libertadores/Champions Continental "de verdade": 2 grupos de 4 times (turno único dentro do grupo),
// os 2 primeiros de cada grupo avançam para as semifinais (ida e volta), depois final (jogo único).
function buildContinentalCup(name, poolTeams, playerClub){
  const others = poolTeams.filter(t=>t.id!==playerClub.id).sort(()=>Math.random()-0.5);
  const chosen = others.slice(0, Math.min(7, others.length));
  const groupA = [playerClub, ...chosen.slice(0,3)];
  const groupB = chosen.slice(3,7);
  const hasGroupB = groupB.length>=2;
  const groupARounds = roundRobin(groupA);
  const groupBRounds = hasGroupB ? roundRobin(groupB) : [];
  const groupAStandings = {}; groupA.forEach(t=>{ groupAStandings[t.id]={club:t,j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}; });
  const groupBStandings = {}; groupB.forEach(t=>{ groupBStandings[t.id]={club:t,j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}; });
  return { name, phase:"groups", groupA, groupB, groupARounds, groupBRounds, groupAStandings, groupBStandings, hasGroupB,
    currentGroupRound:0, playerClubId:playerClub.id, semis:null, finalTie:null, eliminated:false, champion:null, scheduledWeeks:[], playerGoals:0, playerAssists:0 };
}
function continentalGroupStandingsSorted(standings, teams){
  return teams.map(t=>standings[t.id]).sort((a,b)=>(b.pts-a.pts)||((b.gp-b.gc)-(a.gp-a.gc))||(b.gp-a.gp));
}
function findPlayerContinentalTie(cup){
  if(!cup || cup.champion || cup.eliminated) return null;
  if(cup.phase==="groups"){
    const round = cup.groupARounds[cup.currentGroupRound];
    if(!round) return null;
    return round.find(m=>m.home.id===cup.playerClubId||m.away.id===cup.playerClubId) || null;
  }
  if(cup.phase==="semis" && cup.semis){
    const leg = cup.semis.legs.find(l=>!l.resolved && (l.home.id===cup.playerClubId||l.away.id===cup.playerClubId));
    return leg || null;
  }
  if(cup.phase==="final" && cup.finalTie && !cup.finalTie.resolved) return cup.finalTie;
  return null;
}
function advanceContinentalCup(cup, playerWon, playerClub, opponentClub, homeGoals, awayGoals){
  if(cup.phase==="groups"){
    const roundA = cup.groupARounds[cup.currentGroupRound].map(m=>{
      const isPlayerMatch = m.home.id===cup.playerClubId || m.away.id===cup.playerClubId;
      if(isPlayerMatch) applyResultToStandings(cup.groupAStandings, m.home, m.away, homeGoals, awayGoals);
      else { const res=quickSimResult(m.home,m.away); applyResultToStandings(cup.groupAStandings, m.home, m.away, res.homeGoals, res.awayGoals); }
      return { ...m, resolved:true };
    });
    const roundB = (cup.groupBRounds[cup.currentGroupRound]||[]).map(m=>{
      const res = quickSimResult(m.home, m.away);
      applyResultToStandings(cup.groupBStandings, m.home, m.away, res.homeGoals, res.awayGoals);
      return { ...m, resolved:true };
    });
    const newGroupARounds = [...cup.groupARounds]; newGroupARounds[cup.currentGroupRound] = roundA;
    const newGroupBRounds = [...cup.groupBRounds]; if(cup.groupBRounds[cup.currentGroupRound]) newGroupBRounds[cup.currentGroupRound] = roundB;
    const maxRounds = Math.max(cup.groupARounds.length, cup.groupBRounds.length);
    const nextRound = cup.currentGroupRound+1;
    if(nextRound < maxRounds){
      return { ...cup, groupARounds:newGroupARounds, groupBRounds:newGroupBRounds, currentGroupRound:nextRound };
    }
    const topA = continentalGroupStandingsSorted(cup.groupAStandings, cup.groupA).slice(0,2).map(r=>r.club);
    const topB = cup.hasGroupB ? continentalGroupStandingsSorted(cup.groupBStandings, cup.groupB).slice(0,2).map(r=>r.club) : [];
    const playerQualified = topA.some(t=>t.id===cup.playerClubId);
    const base = { ...cup, groupARounds:newGroupARounds, groupBRounds:newGroupBRounds };
    if(!playerQualified) return { ...base, phase:"done", eliminated:true };
    if(topB.length<2){
      // Sem grupo B disponível (país com poucos clubes cadastrados): vai direto pros 2 primeiros do grupo do jogador na final.
      return { ...base, phase:"final", finalTie:{ home:topA[0], away:topA[1], resolved:false, winner:null } };
    }
    // Semifinais cruzadas: 1ºA x 2ºB (ida e volta) e 1ºB x 2ºA (ida e volta).
    const semis = { legs:[
      { tie:"semi1", leg:1, home:topA[0], away:topB[1], resolved:false, homeGoals:null, awayGoals:null },
      { tie:"semi1", leg:2, home:topB[1], away:topA[0], resolved:false, homeGoals:null, awayGoals:null },
      { tie:"semi2", leg:1, home:topB[0], away:topA[1], resolved:false, homeGoals:null, awayGoals:null },
      { tie:"semi2", leg:2, home:topA[1], away:topB[0], resolved:false, homeGoals:null, awayGoals:null },
    ]};
    return { ...base, phase:"semis", semis };
  }
  if(cup.phase==="semis"){
    const legIdx = cup.semis.legs.findIndex(l=>!l.resolved && (l.home.id===cup.playerClubId||l.away.id===cup.playerClubId));
    const leg = cup.semis.legs[legIdx];
    const newLegs = cup.semis.legs.map((l,i)=> i===legIdx ? { ...l, resolved:true, homeGoals, awayGoals } : l);
    // Resolve automaticamente a outra semifinal (que não envolve o jogador) inteira, ida e volta, se ainda não resolvida.
    const otherTie = leg.tie==="semi1" ? "semi2" : "semi1";
    const finalLegs = newLegs.map(l=>{
      if(l.tie===otherTie && !l.resolved){
        const res = quickSimResult(l.home, l.away);
        return { ...l, resolved:true, homeGoals:res.homeGoals, awayGoals:res.awayGoals };
      }
      return l;
    });
    const allResolved = finalLegs.every(l=>l.resolved);
    if(!allResolved){
      return { ...cup, semis:{ legs:finalLegs } };
    }
    // Placar agregado por confronto (soma dos dois jogos, considerando o mando de cada perna).
    function aggregateWinner(tieName, teamX, teamY){
      const legs = finalLegs.filter(l=>l.tie===tieName);
      let goalsX=0, goalsY=0;
      legs.forEach(l=>{
        if(l.home.id===teamX.id){ goalsX+=l.homeGoals; goalsY+=l.awayGoals; }
        else { goalsX+=l.awayGoals; goalsY+=l.homeGoals; }
      });
      if(goalsX===goalsY) return Math.random()<0.5?teamX:teamY; // empate no agregado, decide por pênaltis "de fora de campo"
      return goalsX>goalsY ? teamX : teamY;
    }
    const semi1Teams = [finalLegs.find(l=>l.tie==="semi1").home, finalLegs.find(l=>l.tie==="semi1").away];
    const semi2Teams = [finalLegs.find(l=>l.tie==="semi2").home, finalLegs.find(l=>l.tie==="semi2").away];
    const finalist1 = aggregateWinner("semi1", semi1Teams[0], semi1Teams[1]);
    const finalist2 = aggregateWinner("semi2", semi2Teams[0], semi2Teams[1]);
    const playerAdvanced = finalist1.id===cup.playerClubId || finalist2.id===cup.playerClubId;
    if(!playerAdvanced){
      return { ...cup, semis:{ legs:finalLegs }, phase:"done", eliminated:true };
    }
    return { ...cup, semis:{ legs:finalLegs }, phase:"final", finalTie:{ home:finalist1, away:finalist2, resolved:false, winner:null } };
  }
  if(cup.phase==="final"){
    const winner = playerWon ? playerClub : opponentClub;
    // "champion" só fica marcado quando é de fato o clube do jogador — perder a final conta como eliminado
    // para fins de status (o texto da notícia já diferencia "vice-campeão" de "eliminado nos grupos").
    return { ...cup, phase:"done", champion: playerWon ? winner : null, eliminated: !playerWon, finalTie:{...cup.finalTie, resolved:true, winner} };
  }
  return cup;
}
function scheduleContinentalWeeks(cup, totalLeagueWeeks, offset){
  const eventsCount = cup.groupARounds.length + 2 + 1; // rodadas de grupo + 2 pernas de semifinal + final
  const weeks = [];
  for(let i=1;i<=eventsCount;i++){
    let w = Math.round((totalLeagueWeeks*i)/(eventsCount+1)) + (offset||0);
    if(w%2!==0) w+=1;
    if(w<2) w=2;
    weeks.push(w);
  }
  return { ...cup, scheduledWeeks:weeks };
}
function continentalRoundLabel(cup){
  if(cup.phase==="groups") return `Fase de grupos — rodada ${cup.currentGroupRound+1}/${cup.groupARounds.length}`;
  if(cup.phase==="semis"){
    const playerLegs = cup.semis.legs.filter(l=>l.home.id===cup.playerClubId||l.away.id===cup.playerClubId);
    const resolvedCount = playerLegs.filter(l=>l.resolved).length;
    return `Semifinal — jogo de ${resolvedCount===0?"ida":"volta"}`;
  }
  if(cup.phase==="final") return "Final";
  return "";
}

// Copa nacional (tipo Copa do Brasil): mistura divisões de verdade, priorizando os clubes de maior
// reputação — 16 vagas, começando nas oitavas de final, garantindo o clube do jogador entre elas.
function buildDomesticCupPool(playerClub){
  const link = DIVISION_LINKS[playerClub.league];
  const pool = clubsByCountry(playerClub.countryId).filter(c=>{
    if(c.league===playerClub.league) return true;
    if(link && link.down && c.league===link.down) return true;
    if(link && link.up && c.league===link.up) return true;
    return false;
  });
  const others = pool.filter(c=>c.id!==playerClub.id).sort((a,b)=>b.reputation-a.reputation).slice(0,15);
  return [playerClub, ...others];
}

function buildSeasonCups(playerClub, standingsQualified){
  const domesticPool = buildDomesticCupPool(playerClub);
  let cup = buildCup(playerClub.countryId==="brasil"?"Copa do Brasil":"Copa Nacional", domesticPool, playerClub, 16);
  const eligible = standingsQualified || playerClub.tier==="grande" || playerClub.reputation>=70;
  let continentalCup = null;
  if(eligible){
    const continentPoolTeams = continentPool(playerClub.countryId).flatMap(cid=>clubsByCountry(cid)).filter(c=>c.tier!=="pequeno");
    const contName = SOUTH_AMERICA.includes(playerClub.countryId) ? "Libertadores" : "Champions Continental";
    continentalCup = buildContinentalCup(contName, continentPoolTeams, playerClub);
  }
  return { cup, continentalCup };
}

// Multiplicador de evolução por idade (BALANCEADO — valores mais conservadores que um FM arcade)
// Paga o salário da semana — chamado sempre que uma semana de carreira avança (treino, jogo, lesão, suspensão, folga).
function payWeeklySalary(player){
  const salary = player.weeklySalary||0;
  if(salary<=0) return player;
  return { ...player, money:(player.money||0)+salary, careerEarnings:(player.careerEarnings||0)+salary };
}
function ageMultiplier(age){
  if(age<=18) return 1.35;
  if(age<=24) return 1.0;
  if(age<=29) return 0.55;
  if(age<=33) return 0.28;
  return 0.1;
}

// Evolução pela atuação em campo — nota baixa não rende nada (pode até regredir um pouco),
// nota alta rende bem mais que um treino comum. Só mexe nos atributos que a partida realmente usou.
function applyMatchAttributeProgress(playerIn, rating, usedKeys){
  const player = JSON.parse(JSON.stringify(playerIn));
  const uniqueKeys = [...new Set((usedKeys||[]).filter(Boolean))];
  if(uniqueKeys.length===0) return player;
  let multiplier;
  if(rating<4.5) multiplier = -0.35;
  else if(rating<5.9) multiplier = 0.05;
  else if(rating<6.9) multiplier = 0.5;
  else if(rating<7.9) multiplier = 1.0;
  else if(rating<8.9) multiplier = 1.6;
  else multiplier = 2.4;
  const ageMult = ageMultiplier(player.age);
  uniqueKeys.forEach(key=>{
    const current = getAttr(player, key);
    const headroom = player.hiddenPotential - current;
    let delta = multiplier * ageMult * (rand(2,5)/10);
    if(delta>0 && headroom<=0) delta = 0;
    if(delta>0 && headroom>0 && headroom<delta) delta = headroom*0.5;
    if(delta<0) delta = Math.max(delta, -(current-1)); // nunca deixa negativo
    if(delta!==0) setAttr(player, key, current+delta);
  });
  player.overall = calculateOverall(player.position, player.attributes);
  return player;
}

function applyTraining(player, coachTrainingQuality, optionId){
  const option = TRAINING_OPTIONS.find(o=>o.id===optionId);
  const updated = JSON.parse(JSON.stringify(player));
  const energyBefore = updated.energy;
  updated.energy = Math.round(Math.min(100, Math.max(0, updated.energy - option.energyCost)));

  const disciplined = updated.personalityTraits.includes("Disciplinado") || updated.personalityTraits.includes("Profissional exemplar");
  const mult = ageMultiplier(updated.age) * (coachTrainingQuality/70) * (disciplined?1.15:1);

  const gains=[];
  option.boostKeys.forEach(key=>{
    const current = getAttr(updated,key);
    const headroom = Math.max(0, updated.hiddenPotential - current);
    // BALANCEADO: ganho pequeno por sessão (0.15–0.55 pontos), trava suave perto do potencial.
    const raw = rand(1,3) * 0.18 * mult * (headroom>0 ? Math.min(1, headroom/15) : 0.1);
    if(raw>0.02){ setAttr(updated,key,current+raw); gains.push({key,amount:Math.round(raw*10)/10}); }
  });
  updated.overall = calculateOverall(updated.position, updated.attributes);

  const fatigueFactor = energyBefore<30 ? 1.8 : energyBefore<55 ? 1.2 : 1;
  const injuryOccurred = Math.random()*100 < option.injuryRisk*fatigueFactor;

  if(option.energyCost<0) updated.morale = Math.round(Math.min(100, updated.morale+2));
  if(optionId==="party"){ updated.morale = Math.round(Math.min(100, updated.morale+10)); updated.reputation.fans = Math.round(Math.min(100, updated.reputation.fans+3)); }
  if(optionId==="family"){ updated.morale = Math.round(Math.min(100, updated.morale+6)); updated.relationships.family = Math.round(Math.min(100, updated.relationships.family+4)); }

  return { player:updated, energyBefore, energyAfter:updated.energy, gains, injuryOccurred };
}

function generateMatchMoments(position, count){
  count = count || 3;
  const group = POSITION_GROUP[position] || "MEIO";
  const specific = [...MOMENTS_BY_GROUP[group]].sort(()=>Math.random()-0.5).slice(0, count-1);
  const universal = [...MOMENTS_BY_GROUP.ALL].sort(()=>Math.random()-0.5).slice(0,1);
  const chosen = [...specific, ...universal].sort(()=>Math.random()-0.5).slice(0,count);
  return chosen.map((t,i)=>({ minute: rand(6,84) + i*4, description:t.description, options:t.options, _template:t }));
}

function computeSuccessChance(player, moment, option, opponentQuality){
  const attrSum = option.usesAttributes.reduce((s,k)=>s+getAttr(player,k),0);
  const attrAvg = attrSum/option.usesAttributes.length;
  const riskPenalty = option.risk==="alto" ? -8 : option.risk==="médio" ? -2 : 4;
  const moraleBoost = (player.morale-50)/10;
  const base = attrAvg + riskPenalty + moraleBoost - opponentQuality/6;
  // O roll real soma ruído uniforme entre -12 e 12 e exige base+ruído>=48;
  // isso deriva a probabilidade analítica exata dessa distribuição uniforme.
  const pct = Math.max(2, Math.min(98, Math.round(((base-36)/24)*100)));
  return pct;
}

function resolveChoice(player, moment, choiceId, opponentQuality){
  const template = moment._template;
  const option = moment.options.find(o=>o.id===choiceId);
  const attrSum = option.usesAttributes.reduce((s,k)=>s+getAttr(player,k),0);
  const attrAvg = attrSum/option.usesAttributes.length;
  const riskPenalty = option.risk==="alto" ? -8 : option.risk==="médio" ? -2 : 4;
  const moraleBoost = (player.morale-50)/10;
  const skillScore = attrAvg + riskPenalty + moraleBoost - opponentQuality/6 + rand(-12,12);
  const success = skillScore >= 48;

  const goal = success && !!template.canScore && Math.random() < (option.risk==="alto"?0.72:0.58);
  const assist = success && !goal && !!template.canAssist && Math.random() < 0.28;
  const save = success && !!template.canSave && Math.random() < 0.65;
  const defense = success && !!template.canDefend && !goal && !assist && Math.random() < 0.55;

  let card;
  if(template.cardRisk && Math.random() < template.cardRisk*(success?0.35:1)){
    card = Math.random()<0.15 ? "vermelho" : "amarelo";
  }

  const successTexts = ["Você executa a jogada com categoria — a torcida vibra!","Excelente decisão: a jogada funciona como planejado.","Você resolve bem a situação e o lance termina a seu favor."];
  const failTexts = ["A jogada não sai como esperado e a chance se perde.","Você erra o timing e a oportunidade escapa.","A pressão do adversário atrapalha o lance."];
  let text = pick(success?successTexts:failTexts);
  let receiverId = null;
  if(goal) text = `GOL! ${player.firstName} ${player.lastName} não perdoa e a bola morre no fundo da rede!`;
  else if(assist){
    const attackers = (player.squad||[]).filter(t=>["CA","SA","PD","PE","MEIA"].includes(t.position));
    const receiver = pick(attackers.length>0?attackers:(player.squad||[{name:"seu companheiro"}]));
    receiverId = receiver.id || null;
    text = `Assistência perfeita de ${player.firstName}! ${receiver.name} só empurra para o gol!`;
  }
  else if(save) text = "DEFESA! Você evita o gol certo com uma intervenção decisiva!";
  else if(defense) text = "Corte decisivo! Você tira o perigo com categoria.";
  if(card==="amarelo") text += " O árbitro mostra o cartão amarelo.";
  if(card==="vermelho") text += " O árbitro expulsa você de campo!";

  return { success, goal, assist, save, defense, card, text, receiverId, usesAttributes: option.usesAttributes };
}

const CORNER_PROFILES = {
  esquerdo: { label:"Canto esquerdo", execRisk:-7, keeperSaveChance:0.20 },
  centro:   { label:"Meio do gol", execRisk:5, keeperSaveChance:0.42 },
  direito:  { label:"Canto direito", execRisk:-7, keeperSaveChance:0.20 },
};
function computeSetPieceChance(player, kind, corner){
  const attr = kind==="penalty" ? getAttr(player,"penalty") : getAttr(player,"freeKick");
  const composure = getAttr(player,"composure");
  const profile = CORNER_PROFILES[corner];
  const base = (attr*0.8 + composure*0.2) + profile.execRisk;
  const onTargetPct = Math.max(20, Math.min(97, Math.round(base + 10)));
  return { onTargetPct, profile };
}
function resolveSetPiece(player, kind, corner, opponentQuality){
  const { onTargetPct, profile } = computeSetPieceChance(player, kind, corner);
  const onTarget = Math.random()*100 < onTargetPct;
  const sideWord = corner==="centro" ? "no meio do gol" : corner==="esquerdo" ? "no canto esquerdo" : "no canto direito";
  if(!onTarget){
    const missTexts = kind==="penalty"
      ? [`Você chuta ${sideWord} e a bola vai por cima! Grande chance perdida.`, "A bola explode na trave e sai.", "Cobrança sai por cima do travessão."]
      : [`A cobrança de falta sai por cima do gol, ${sideWord}.`, "A barreira desvia a cobrança.", "O chute sai à margem do gol."];
    return { success:false, goal:false, assist:false, text: pick(missTexts), usesAttributes:[kind==="penalty"?"penalty":"freeKick","composure"] };
  }
  const keeperSaveChance = Math.min(0.85, profile.keeperSaveChance * (opponentQuality/70));
  const saved = Math.random() < keeperSaveChance;
  if(saved){
    const keeperDive = corner==="centro" ? "O goleiro fica parado no meio e agarra a bola!" : `O goleiro pula para o ${corner==="esquerdo"?"canto esquerdo":"canto direito"} e faz a defesa!`;
    return { success:false, goal:false, assist:false, text: keeperDive, usesAttributes:[kind==="penalty"?"penalty":"freeKick","composure"] };
  }
  const keeperGuess = corner==="centro" ? "O goleiro se joga para um dos lados e não alcança!" : `O goleiro pula para o lado errado!`;
  const goalTexts = kind==="penalty"
    ? [`GOL de ${player.firstName} ${player.lastName}! Cobrança perfeita ${sideWord}, sem chances para o goleiro! ${keeperGuess}`, `GOL! Frieza total de ${player.firstName} na hora de decidir. ${keeperGuess}`]
    : [`GOL DE FALTA de ${player.firstName} ${player.lastName}! Que cobrança espetacular ${sideWord}!`, `GOL! A cobrança de ${player.firstName} faz a curva e morre no ângulo. ${keeperGuess}`];
  return { success:true, goal:true, assist:false, text: pick(goalTexts), usesAttributes:[kind==="penalty"?"penalty":"freeKick","composure"] };
}

function computeMatchRating(outcomes){
  const playerGoals = outcomes.filter(o=>o.goal).length;
  const playerAssists = outcomes.filter(o=>o.assist).length;
  const keyMoments = outcomes.filter(o=>o.save||o.defense).length;
  const successRate = outcomes.length>0 ? outcomes.filter(o=>o.success).length/outcomes.length : 0.5;
  const yellowCard = outcomes.some(o=>o.card==="amarelo");
  const redCard = outcomes.some(o=>o.card==="vermelho");
  let rating = 5.5 + successRate*2.2 + playerGoals*1.1 + playerAssists*0.7 + keyMoments*0.5;
  if(yellowCard) rating -= 0.3;
  if(redCard) rating -= 1.8;
  return Math.max(2, Math.min(10, Math.round(rating*10)/10));
}

function buildMatchResult(player, opponentClub, competition, isHome, moments, outcomes, liveHomeGoals, liveAwayGoals){
  const log = moments.map((m,i)=>({ minute:m.minute, text:outcomes[i].text, success:outcomes[i].success, goal:outcomes[i].goal, assist:outcomes[i].assist, card:outcomes[i].card }));
  const playerGoals = outcomes.filter(o=>o.goal).length;
  const playerAssists = outcomes.filter(o=>o.assist).length;
  const saves = outcomes.filter(o=>o.save).length;
  const keyMoments = outcomes.filter(o=>o.save||o.defense).length;
  const yellowCard = outcomes.some(o=>o.card==="amarelo");
  const redCard = outcomes.some(o=>o.card==="vermelho");
  const rating = computeMatchRating(outcomes);

  // O placar é construído ao vivo durante a partida (lances do jogador + lances automáticos),
  // não sorteado de uma vez no final — por isso é recebido já pronto aqui.
  const homeGoals = liveHomeGoals!=null ? liveHomeGoals : rand(0,2);
  const awayGoals = liveAwayGoals!=null ? liveAwayGoals : rand(0,2);
  const cleanSheet = isHome ? awayGoals===0 : homeGoals===0;

  const injured = Math.random() < (redCard?0.02:0.05) * (player.energy<35?1.6:1);

  return { opponentClub, isHome, competition, homeGoals, awayGoals, playerGoals, playerAssists, saves, cleanSheet, rating, log, yellowCard, redCard, injured };
}

function generateAutoTick(minute, isOpponentChance){
  const kind = isOpponentChance ? "opponentMiss" : "teamMiss";
  return { minute, kind, text: pick(AUTO_TICK_TEXTS[kind]) };
}
function resolveAutoTick(tick, opponentQuality, teamQuality, teammateSquad, opponentClub){
  const isOpponent = !!tick.isOpponentChance;
  const chance = isOpponent ? opponentQuality/230 : teamQuality/230; // ~30-40% base
  const goal = Math.random() < chance;
  const missKind = isOpponent ? "opponentMiss" : "teamMiss";
  if(!goal) return { ...tick, kind:missKind, text: pick(AUTO_TICK_TEXTS[missKind]) };
  const goalKind = isOpponent ? "opponentGoal" : "teamGoal";
  let scorerName = "", scorerId = null;
  if(isOpponent){
    const nat = (opponentClub && COUNTRY_NATIONALITY[opponentClub.countryId]) || "Brasil";
    const { first, last } = generateFictionalName(nat);
    scorerName = `${first} ${last}`;
  } else if(teammateSquad && teammateSquad.length>0){
    const attackers = teammateSquad.filter(t=>["CA","SA","PD","PE","MEIA","MC","VOL"].includes(t.position));
    const scorer = pick(attackers.length>0 ? attackers : teammateSquad);
    scorerName = scorer.name;
    scorerId = scorer.id;
  } else {
    scorerName = "Seu companheiro";
  }
  const text = pick(AUTO_TICK_TEXTS[goalKind]).replace("{scorer}", scorerName);
  return { ...tick, kind: goalKind, text, scorerName, scorerId };
}

function computeLeagueTopScorers(calendar, player, seasonGoalsSoFar, playerLiveGoals){
  const roundsPlayed = Math.max(1, calendar.standings[player.club.id] ? calendar.standings[player.club.id].j : 1);
  const rows = [];
  Object.values(calendar.standings).forEach(s=>{
    if(s.club.id===player.club.id) return;
    // Estimativa determinística (baseada no clube) do artilheiro do time, escalada pelas rodadas já disputadas.
    const seed = s.club.id.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
    const scorer = generateFictionalName(COUNTRY_NATIONALITY[s.club.countryId]||"Brasil");
    const rate = 0.3 + ((seed%40)/100) + (s.club.squadQuality-60)/200;
    const goals = Math.max(0, Math.round(rate * roundsPlayed));
    rows.push({ name:`${scorer.first} ${scorer.last}`, club:s.club.name, goals });
  });
  // Companheiros de elenco de verdade — gols marcados de fato durante as partidas, não estimativa.
  (player.squad||[]).forEach(tm=>{ if(tm.goals>0) rows.push({ name:tm.name, club:player.club.name, goals:tm.goals }); });
  const playerGoalsTotal = (seasonGoalsSoFar||0) + (playerLiveGoals||0);
  rows.push({ name:`${player.firstName} ${player.lastName}`, club:player.club.name, goals: playerGoalsTotal, isPlayer:true });
  return rows.sort((a,b)=>b.goals-a.goals).slice(0,8);
}
function computeLeagueTopAssists(calendar, player, seasonAssistsSoFar){
  const roundsPlayed = Math.max(1, calendar.standings[player.club.id] ? calendar.standings[player.club.id].j : 1);
  const rows = [];
  Object.values(calendar.standings).forEach(s=>{
    if(s.club.id===player.club.id) return;
    const seed = s.club.id.split("").reduce((a,c)=>a+c.charCodeAt(0)*3,0);
    const playmaker = generateFictionalName(COUNTRY_NATIONALITY[s.club.countryId]||"Brasil");
    const rate = 0.22 + ((seed%35)/100) + (s.club.squadQuality-60)/220;
    const assists = Math.max(0, Math.round(rate * roundsPlayed));
    rows.push({ name:`${playmaker.first} ${playmaker.last}`, club:s.club.name, assists });
  });
  rows.push({ name:`${player.firstName} ${player.lastName}`, club:player.club.name, assists:(seasonAssistsSoFar||0), isPlayer:true });
  return rows.sort((a,b)=>b.assists-a.assists).slice(0,8);
}

// Artilharia genérica pra qualquer copa (Copa Nacional ou Libertadores/Continental) — estima os gols
// dos jogadores fictícios dos outros clubes participantes, com base em quantas rodadas de copa já rolaram,
// e usa o placar de gols/assistências DE VERDADE que o jogador principal marcou nessa copa específica.
function computeCupTopScorers(cup, player, statKey){
  if(!cup) return [];
  const teams = cup.teams || [...(cup.groupA||[]), ...(cup.groupB||[])];
  const roundsEstimate = cup.phase ? (cup.phase==="groups"?cup.currentGroupRound+1:cup.phase==="semis"?4:5) : (cup.currentRoundIdx+1);
  const rows = [];
  const playerTeamId = cup.playerClubId || player.club.id;
  const playerTeam = teams.find(t=>t.id===playerTeamId);
  teams.forEach(t=>{
    if(t.id===playerTeamId) return;
    const seed = t.id.split("").reduce((a,c)=>a+c.charCodeAt(0)*(statKey==="goals"?1:3),0);
    const scorer = generateFictionalName(COUNTRY_NATIONALITY[t.countryId]||"Brasil");
    const base = statKey==="goals" ? 0.35 : 0.2;
    const rate = base + ((seed%30)/100) + (t.squadQuality-60)/220;
    const value = Math.max(0, Math.round(rate * roundsEstimate));
    if(value>0) rows.push({ name:`${scorer.first} ${scorer.last}`, club:t.name, [statKey]:value });
  });
  const playerValue = statKey==="goals" ? (cup.playerGoals||0) : (cup.playerAssists||0);
  rows.push({ name:`${player.firstName} ${player.lastName}`, club:(playerTeam?playerTeam.name:player.club.name), [statKey]:playerValue, isPlayer:true });
  return rows.sort((a,b)=>b[statKey]-a[statKey]).slice(0,8);
}

// ============================================================
// EVOLUÇÃO DE FIM DE TEMPORADA — BALANCEADA
// ============================================================
function ageEvolutionRange(age){
  if(age<=18) return [1.5, 3.5];
  if(age<=24) return [1, 2.5];
  if(age<=29) return [-0.5, 1];
  if(age<=33) return [-2, 0.5];
  if(age<=36) return [-4, -1.5];
  return [-7, -3];
}
function applySeasonEvolution(playerIn, progress, coachTrainingQuality){
  const player = JSON.parse(JSON.stringify(playerIn));
  const overallBefore = player.overall;
  const averageRating = progress.matchesPlayed>0 ? progress.ratingSum/progress.matchesPlayed : 5.5;
  const [lo,hi] = ageEvolutionRange(player.age);
  const performanceFactor = (averageRating-6)/4;
  const coachFactor = (coachTrainingQuality-60)/140;
  const disciplineBonus = (player.personalityTraits.includes("Disciplinado")||player.personalityTraits.includes("Profissional exemplar")) ? 0.15 : 0;

  const keys = [...Object.keys(player.attributes.physical), ...Object.keys(player.attributes.technical), ...Object.keys(player.attributes.mental)];
  keys.forEach(key=>{
    const current = getAttr(player,key);
    const headroom = player.hiddenPotential - current;
    let delta = (rand(lo*10,hi*10)/10) / keys.length * 5.5;
    delta += performanceFactor + coachFactor + disciplineBonus;
    if(headroom<=0) delta = Math.min(delta, -0.05);
    if(delta>0 && headroom < delta) delta = headroom*0.5;
    setAttr(player, key, current + delta*0.14);
  });
  player.overall = calculateOverall(player.position, player.attributes);
  player.age += 1;

  let retirementSuggested=false, retirementReason;
  if(player.age>=38){ retirementSuggested=true; retirementReason="idade"; }
  else if(player.age>=34 && player.overall<55){ retirementSuggested=true; retirementReason="queda de nível"; }
  else if(player.injuries.filter(i=>i.severity==="grave").length>=3 && player.age>=30){ retirementSuggested=true; retirementReason="lesões"; }

  return { player, overallBefore, overallAfter:player.overall, averageRating, retirementSuggested, retirementReason };
}

// ============================================================
// COPA DO MUNDO — reaproveita o motor da copa continental (grupo -> semifinal -> final),
// numa escala reduzida (8 seleções em vez de 48), mas sem pular nenhuma fase.
// ============================================================
function buildWorldCup(player, season){
  const playerNT = buildPlayerNationalTeamClub(player);
  const usedNats = new Set([player.nationality, "Holanda"]);
  const others = [];
  for(let i=0;i<7;i++){
    let candidates = NATIONALITIES.filter(n=>!usedNats.has(n));
    if(candidates.length===0) candidates = NATIONALITIES.filter(n=>n!=="Holanda");
    const nat = pick(candidates);
    usedNats.add(nat);
    const [primaryColor, secondaryColor] = NATIONAL_TEAM_COLORS[nat] || pick([["#0033A0","#FFFFFF"],["#C8102E","#FFFFFF"],["#000000","#FFD100"]]);
    others.push({ id:`wc-${nat}-${i}-${season}`, name:`Seleção ${["Estados Unidos"].includes(nat)?"dos "+nat:"da "+nat}`, primaryColor, secondaryColor,
      squadQuality: rand(60,93), reputation: rand(60,93), tier:"grande", countryId:"internacional", league:"Copa do Mundo" });
  }
  return buildContinentalCup(`Copa do Mundo ${season}`, [playerNT, ...others], playerNT);
}

// Convocação para a seleção nacional — agenda partidas de verdade (jogáveis), não resolve sozinha.
function checkNationalCallUp(player, season, totalLeagueWeeks){
  if(player.age<18 || player.reputation.national<45) return { player, called:false, nationalTeam:null };
  const chance = Math.min(0.85, (player.reputation.national-40)/70 + (player.overall-65)/150);
  if(Math.random() > chance) return { player, called:false, nationalTeam:null };

  const matchCount = rand(2,3);
  let updated = addMilestone(player, `Convocado para a seleção nacional para a próxima Data Fifa.`, season, "seleção");
  const news = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"nacional",
    headline: `${updated.firstName} ${updated.lastName} é convocado para a seleção nacional!`,
    summary: `O jovem atleta vai disputar ${matchCount} amistosos internacionais representando o país.`,
    date:`Temporada ${season}`, impact:14, season };
  updated = { ...updated, newsLog:[news, ...updated.newsLog].slice(0,40) };

  const weeks = [];
  for(let i=1;i<=matchCount;i++){
    let w = Math.round((totalLeagueWeeks*i)/(matchCount+1)) + 8; // deslocado das copas pra não colidir
    if(w%2!==0) w+=1;
    weeks.push(w);
  }
  const nationalTeam = { matchesTotal:matchCount, matchesRemaining:matchCount, scheduledWeeks:weeks };
  return { player:updated, called:true, nationalTeam };
}

function computeSeasonAwards(player, seasonRecord, calendar){
  const awards = [];
  const standings = sortedStandings(calendar);
  const clubRow = standings.find(s=>s.club.id===player.club.id);
  const clubPosition = clubRow ? standings.indexOf(clubRow)+1 : null;
  const topScorersInLeague = computeLeagueTopScorers(calendar, player, 0, seasonRecord.goals);
  const isTopScorer = topScorersInLeague[0] && topScorersInLeague[0].isPlayer;
  const topAssistsInLeague = computeLeagueTopAssists(calendar, player, seasonRecord.assists);
  const isTopAssister = topAssistsInLeague[0] && topAssistsInLeague[0].isPlayer;

  if(isTopScorer && seasonRecord.goals>=20){
    awards.push({ id:"chuteira-platina", icon:"👢💎", title:"Chuteira de Platina — Artilheiro Mundial", description:`${seasonRecord.goals} gols na temporada, número de referência mundial no ${calendar.league}.` });
  } else if(isTopScorer && seasonRecord.goals>=8){
    awards.push({ id:"chuteira-ouro", icon:"👢🥇", title:`Chuteira de Ouro — ${calendar.league}`, description:`${seasonRecord.goals} gols na temporada, o maior número da competição.` });
  }
  if(isTopAssister && seasonRecord.assists>=6){
    awards.push({ id:"garcom-ouro", icon:"🍽️🥇", title:`Garçom de Ouro — ${calendar.league}`, description:`${seasonRecord.assists} assistências na temporada, a maior marca da competição.` });
  }
  if(player.position==="GOL" && seasonRecord.cleanSheets>=8 && seasonRecord.matches>=10){
    awards.push({ id:"luva-ouro", icon:"🧤🥇", title:`Luva de Ouro — ${calendar.league}`, description:`${seasonRecord.cleanSheets} jogos sem sofrer gol na temporada, a melhor marca de goleiro da competição.` });
  }
  if(seasonRecord.averageRating>=7.8 && seasonRecord.matches>=8) awards.push({ id:"bola-de-ouro", icon:"⚽🥇", title:"Bola de Ouro da temporada", description:`Eleito o melhor jogador da liga, com nota média ${seasonRecord.averageRating}.` });
  else if(seasonRecord.averageRating>=7.2 && player.age<=21) awards.push({ id:"melhor-jovem", icon:"🌟", title:"Melhor jovem da competição", description:`Destaque entre os jogadores mais jovens da liga nesta temporada.` });
  if(clubPosition===1) awards.push({ id:"campeao", icon:"🏆", title:`Campeão do ${calendar.league}`, description:`${player.club.name} terminou a temporada na liderança da tabela.` });
  return awards;
}

// TRANSFERÊNCIAS — propostas de clubes reais
// ============================================================
function generateTransferOffers(player, currentClub){
  const eligible = player.overall >= currentClub.reputation - 25 && (player.reputation.national > 15 || player.overall >= 68);
  if(!eligible) return [];
  const chance = Math.min(0.85, 0.15 + (player.overall-60)/100 + player.reputation.national/300);
  if(Math.random() > chance) return [];

  // Mercado amplo: qualquer clube do jogo pode se interessar (inclusive de fora do país),
  // desde que a reputação não esteja fora de proporção com o seu nível atual.
  const candidates = CLUBS.filter(c=>c.id!==currentClub.id && Math.abs(c.reputation - Math.max(currentClub.reputation, player.overall)) < 38);
  const count = rand(2,4);
  const chosen = [...candidates].sort(()=>Math.random()-0.5).slice(0,count);
  return chosen.map(c=>{
    // Clube estrangeiro grande de olho em jogador ainda em desenvolvimento tende a preferir empréstimo primeiro.
    const foreign = c.countryId!==currentClub.countryId;
    const loanLean = foreign && c.reputation > player.overall+15 ? 0.55 : 0.25;
    const isLoan = Math.random() < loanLean;
    return {
      id:`offer-${c.id}-${Date.now()}-${Math.random()}`,
      club:c,
      type: isLoan ? "emprestimo" : "compra",
      salaryPerWeek: Math.round((player.overall*120 + c.reputation*40) * (c.tier==="grande"?1.6:c.tier==="medio"?1.1:0.8) * (isLoan?0.75:1)),
      durationSeasons: isLoan ? 1 : rand(2,4),
      squadRole: c.squadQuality > player.overall+8 ? "Peça de rotação" : c.squadQuality < player.overall-5 ? "Titular imediato" : "Disputa de posição",
      startingChance: Math.max(15, Math.min(95, 100 - (c.squadQuality - player.overall))),
    };
  });
}

let milestoneCounter=0;
function addMilestone(player, text, season, tag){
  milestoneCounter++;
  const entry = { id:`ms-${Date.now()}-${milestoneCounter}`, text, season, tag: tag||"geral" };
  return { ...player, milestones:[entry, ...(player.milestones||[])].slice(0,60) };
}

    ()=>({ headline:`Crise no ${club.name}: torcida cobra reação da diretoria`, summary:`Resultados abaixo do esperado aumentam a pressão sobre o elenco do ${club.name}.` }),
    ()=>{ const nat = COUNTRY_NATIONALITY[club.countryId]||"Brasil"; const {first,last}=generateFictionalName(nat);

    ()=>({ headline:`${club.name} enfrenta dificuldades financeiras, aponta jornal`, summary:`Clube pode precisar negociar peças do elenco na próxima janela.` }),

function pickPressScenario(result, careerMatchesBefore){
  const margin = Math.abs(result.homeGoals - result.awayGoals);
  const playerWon = (result.isHome && result.homeGoals>result.awayGoals) || (!result.isHome && result.awayGoals>result.homeGoals);
  const playerLost = (result.isHome && result.homeGoals<result.awayGoals) || (!result.isHome && result.awayGoals<result.homeGoals);
  let key = "generic";
  if(careerMatchesBefore===0) key = "estreia";
  else if(result.playerGoals>=3) key = "hatTrick";
  else if(result.redCard) key = "redCard";
  else if(playerLost && margin>=3) key = "bigLoss";
  else if(playerWon && margin>=3) key = "bigWin";
  else if(result.rating<=5) key = "poorRating";
  else if(result.rating>=8.5) key = "greatRating";
  const pool = PRESS_SCENARIOS[key] || PRESS_SCENARIOS.generic;
  return { key, scenario: pick(pool) };
}

// Traços dinâmicos: nascem do padrão de resposta do jogador ao longo da carreira, não de uma escolha única.
const PERSONALITY_UNLOCKS = [
  { counterKey:"polemico", threshold:4, trait:"Polêmico" },
  { counterKey:"lider", threshold:4, trait:"Líder do elenco" },
  { counterKey:"profissional", threshold:5, trait:"Profissional exemplar" },
  { counterKey:"humilde", threshold:5, trait:"Queridinho da torcida" },
];
function applyPressAnswer(player, answer, season){
  // A diretoria reage ao tom da resposta: declarações polêmicas incomodam, profissionalismo/liderança agrada.
  const boardDelta = answer.counter==="polemico" ? -5 : (answer.counter==="lider"||answer.counter==="profissional") ? 3 : Math.sign(answer.coachTrust)*1;
  let updated = { ...player,
    reputation:{...player.reputation, press:Math.min(100,Math.max(0,player.reputation.press+answer.press)), fans:Math.min(100,Math.max(0,player.reputation.fans+answer.fans))},
    coachTrust:Math.min(100,Math.max(0,player.coachTrust+answer.coachTrust)),
    relationships:{...player.relationships, board:Math.min(100,Math.max(0,player.relationships.board+boardDelta))},
  };
  if(answer.counter){
    const counters = { ...(updated.personalityCounters||{}) };
    counters[answer.counter] = (counters[answer.counter]||0) + 1;
    updated.personalityCounters = counters;
    const unlock = PERSONALITY_UNLOCKS.find(u=> u.counterKey===answer.counter && counters[u.counterKey]===u.threshold && !updated.personalityTraits.includes(u.trait));
    if(unlock){
      updated.personalityTraits = [...updated.personalityTraits, unlock.trait];
      updated = addMilestone(updated, `Ganhou a fama de "${unlock.trait}" após anos de declarações consistentes.`, season, "personalidade");
    }
  }
  return updated;
}

function OverallCircle({ value, delta, size=120, label="OVERALL" }){
  const radius = size/2-8, circumference=2*Math.PI*radius, pct=Math.min(100,Math.max(0,value))/100, offset=circumference*(1-pct);
  const color = value>=85?"#B8892E":value>=70?"#1D9A54":value>=55?"#2F7FD6":"#5B6B60";
  return (
    <div className="relative inline-flex flex-col items-center justify-center" style={{width:size,height:size}}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={radius} stroke="#E3E9E3" strokeWidth={8} fill="none" />
        <circle cx={size/2} cy={size/2} r={radius} stroke={color} strokeWidth={8} fill="none" strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset} style={{transition:"stroke-dashoffset .7s ease-out"}} />

    </div>
  );
}

function exportCareer(state){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = `${state.player.firstName}_${state.player.lastName}`.replace(/\s+/g,"_");
  a.href=url; a.download=`carreira_${safeName}_t${state.currentSeason}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importCareerFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(!parsed.player || !parsed.currentSeason){ reject(new Error("Arquivo de carreira inválido.")); return; }
        resolve(parsed);
      } catch(e){ reject(new Error("Não foi possível ler o arquivo JSON.")); }
    };
    reader.onerror = () => reject(new Error("Falha ao carregar o arquivo."));
    reader.readAsText(file);
  });
}

function StadiumScene({ primaryColor, secondaryColor }){
  primaryColor = primaryColor || "#155FD1";
  secondaryColor = secondaryColor || "#0F9D51";
  // Multidão barata em performance: poucos elementos SVG, só uma fração anima.
  const crowdDots = [];
  for(let i=0;i<70;i++){
    const side = i%2===0 ? "left" : "right";
    const row = Math.floor(i/10);
    const col = i%10;
    const x = side==="left" ? 4+col*3.2 : 62+col*3.2;
    const y = 6+row*4.2;
    crowdDots.push({ x, y, animate: i%5===0, color: i%3===0?primaryColor:(i%3===1?secondaryColor:"#E8ECE8") });
  }
  return (
    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMax slice" className="absolute inset-0 w-full h-full">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#0E1A14" /><stop offset="100%" stopColor="#152A1E" />
        </linearGradient>
        <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1c7a3f" /><stop offset="100%" stopColor="#0f5a2c" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="100" height="60" fill="url(#skyGrad)" />
      {/* torres de refletor */}
      {[8, 92].map((x,i)=>(
        <g key={i}>
          <rect x={x-0.4} y="10" width="0.8" height="20" fill="#2b3a30" />
          <circle cx={x} cy="9" r="2.2" fill="#FFF7D6" className="floodlight" style={{animationDelay:`${i*0.4}s`}} opacity="0.85" />
        </g>
      ))}
      {/* arquibancada com torcida */}
      <rect x="0" y="14" width="100" height="16" fill="#1a2b20" />
      {crowdDots.map((d,i)=>(
        <circle key={i} cx={d.x} cy={d.y+14} r="0.9" fill={d.color} className={d.animate?"crowd-dot":""} style={{animationDelay:`${(i%7)*0.3}s`}} opacity="0.85" />
      ))}
      {/* gramado */}
      <rect x="0" y="30" width="100" height="30" fill="url(#pitchGrad)" />
      {[0,1,2,3,4,5].map(i=>(<rect key={i} x="0" y={30+i*5} width="100" height="5" fill={i%2===0?"rgba(255,255,255,0.03)":"transparent"} />))}
      <line x1="0" y1="38" x2="100" y2="38" stroke="rgba(255,255,255,0.25)" strokeWidth="0.3" />
      <circle cx="50" cy="38" r="6" fill="none" stroke="rgba(255,255,255,0.25)" strokeWidth="0.3" />
      {/* bola rolando (usa animateMotion nativo do SVG, mais confiável que CSS aqui) */}
      <circle r="1.1" fill="#FFFFFF">
        <animateMotion dur="9s" repeatCount="indefinite" path="M -6,46 L 106,46" />
      </circle>
      {/* partículas leves subindo */}
      {[15,35,55,75,90].map((x,i)=>(
        <circle key={i} cx={x} cy="55" r="0.35" fill="#FFFFFF" opacity="0.3" className="drift-particle" style={{animationDelay:`${i*1.2}s`}} />
      ))}
    </svg>
  );
}

function StartScreen(){
  const { setScreen, setCareer } = useCareer();
  const fileInputRef = useRef(null);

  async function handleImport(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try {
      const state = await importCareerFile(file);
      setCareer(state);
      setScreen("dashboard");
    } catch(err){ alert(err.message); }
    finally { if(fileInputRef.current) fileInputRef.current.value=""; }
  }

  return (
    <div className="min-h-screen relative overflow-hidden flex flex-col items-center justify-center px-6 bg-pitch-950">
      <StadiumScene />
      <div className="absolute inset-0 bg-gradient-to-t from-pitch-950 via-pitch-950/70 to-pitch-950/20" />
      <div className="flex flex-col items-center text-center fade-in relative">
        <span className="eyebrow mb-4 text-white/70">Simulador de carreira</span>
        <h1 className="font-display text-6xl md:text-7xl font-bold tracking-tight text-white mb-3 logo-drop">Real Life <span className="text-touchline">Football</span></h1>
        <p className="text-white/70 max-w-md mb-10 text-sm md:text-base">Aos 16 anos, o mundo te dá uma chance. Cada treino, cada entrevista e cada decisão fora de campo escreve o resto da sua história.</p>
        <div className="flex flex-col sm:flex-row gap-3">
          <button className="btn-primary" onClick={()=>setScreen("creation")}>Nova carreira</button>
          <button className="btn-secondary" onClick={()=>fileInputRef.current && fileInputRef.current.click()}>Importar carreira</button>
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={handleImport} />
        </div>

  );
}

          <button className="btn-primary" disabled={!selected} onClick={confirm}>Assinar contrato e começar</button>
        </div>
      </div>
    </div>
  );
}
