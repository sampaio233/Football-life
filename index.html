      setCareer({ ...career, player:updatedPlayer, weekIndex:career.weekIndex+1, continentalCup:updatedCup,
        seasonProgress:{ ...career.seasonProgress, cupGoals:career.seasonProgress.cupGoals+result.playerGoals, cupAssists:career.seasonProgress.cupAssists+result.playerAssists } });
      setScreen("dashboard");
      return;
    }

    // Classificação: usa exatamente os placares que apareceram no ticker ao vivo, não uma nova simulação.
    applyResultToStandings(career.calendar.standings, homeClub, awayClub, result.homeGoals, result.awayGoals);
    otherGames.forEach(g=> applyResultToStandings(career.calendar.standings, g.home, g.away, g.homeGoals, g.awayGoals));

    const nextSeasonProgress = { ...career.seasonProgress, matchesPlayed:career.seasonProgress.matchesPlayed+1,
      goals:career.seasonProgress.goals+result.playerGoals, assists:career.seasonProgress.assists+result.playerAssists,
      saves:(career.seasonProgress.saves||0)+(result.saves||0), cleanSheets:(career.seasonProgress.cleanSheets||0)+(result.cleanSheet?1:0),
      ratingSum:career.seasonProgress.ratingSum+result.rating, yellowCards:seasonYellow, redCards:career.seasonProgress.redCards+(result.redCard?1:0) };

    setLastMatchResult(result);
    const seasonComplete = nextSeasonProgress.matchesPlayed >= nextSeasonProgress.matchesTotal;

    if(seasonComplete){
      const { newCareer, screen, transferOffers } = finishSeason(career, updatedPlayer, nextSeasonProgress);
      setTransferOffers(transferOffers);
      setCareer(newCareer);
      setScreen(screen);
    } else {
      setCareer({ ...career, player:updatedPlayer, weekIndex:career.weekIndex+1, seasonProgress:nextSeasonProgress, calendar:career.calendar });
      setScreen("dashboard");
    }
  }

  const beat = beatIndex>=0 ? timeline[beatIndex] : null;
  const displayMinute = subPhase==="fulltime"||subPhase==="press" ? "90'" : subPhase==="halftime" ? "45'" : beat ? `${beat.minute}'` : "0'";
  const topScorers = computeLeagueTopScorers(career.calendar, player, career.seasonProgress.goals, outcomes.filter(o=>o.goal).length);

  return (
    <div className="min-h-screen bg-pitch-950 px-4 py-6">
      <div className="max-w-5xl mx-auto grid lg:grid-cols-[1fr_280px] gap-5">
        <div>
          {/* placar principal */}
          {(()=>{ const rivalry = !pendingMatch.isNational && !pendingMatch.isWorldCup ? findRivalry(homeClub.id, awayClub.id) : null;
          return (
          <div className={`card p-4 mb-4 relative overflow-hidden ${rivalry?"border-2":""}`} style={rivalry?{borderColor:"#B8892E"}:{}}>
            <div className="absolute inset-0 opacity-[0.09] pointer-events-none" style={{background:`linear-gradient(120deg, ${homeClub.primaryColor}, ${awayClub.primaryColor})`}} />
            {rivalry && <p className="relative text-center font-display font-bold text-xs tracking-widest mb-2" style={{color:"#B8892E"}}>🔥 {rivalry.name.toUpperCase()} 🔥</p>}
            {goalFlash && (
              <div className="absolute inset-0 flex items-center justify-center z-10 fade-in overflow-hidden" style={{backgroundColor:goalFlash.color}}>
                {goalFlash.intense && [...Array(14)].map((_,i)=>(
                  <span key={i} className="absolute w-1.5 h-1.5 drift-particle" style={{ left:`${(i*7+5)%100}%`, top:`${(i*13)%40}%`, backgroundColor: i%2===0?goalFlash.textColor:"#FFFFFF", animationDuration:`${1.6+(i%4)*0.3}s`, animationDelay:`${(i%5)*0.15}s`, borderRadius: i%3===0?"9999px":"1px" }} />
                ))}
                <div className="text-center pop-in relative">
                  {goalFlash.tag && <p className="font-display text-xs tracking-widest mb-1 opacity-90" style={{color:goalFlash.textColor}}>{goalFlash.tag}</p>}
                  <p className={`font-display font-bold tracking-wide ${goalFlash.intense?"text-6xl":"text-5xl"}`} style={{color:goalFlash.textColor}}>GOOOL!</p>
                  <p className="text-sm mt-1 opacity-90" style={{color:goalFlash.textColor}}>{goalFlash.name}</p>
                </div>
              </div>
            )}
            <div className="flex items-center justify-between relative">
              <TeamTag name={homeClub.name} color={homeClub.primaryColor} secondaryColor={homeClub.secondaryColor} />
              <div className="text-center px-4">
                <p className="text-[10px] text-steel-400 uppercase tracking-wide">{pendingMatch.competition}{!pendingMatch.isCup && ` · Rodada ${currentRoundIdx+1}`}</p>
                <p key={`${homeGoals}-${awayGoals}`} className="font-display text-4xl font-bold text-steel-100 stat-num count-up">{homeGoals} — {awayGoals}</p>
                <div className="flex items-center justify-center gap-1.5 mt-1">
                  {!["intro","fulltime","press"].includes(subPhase) && <span className="w-1.5 h-1.5 rounded-full bg-state-down pulse-dot" />}
                  <p className={`font-display text-sm ${subPhase==="rolling"?"text-touchline pulse-dot":"text-steel-400"}`}>{displayMinute}</p>
                </div>
              </div>
              <TeamTag name={awayClub.name} color={awayClub.primaryColor} secondaryColor={awayClub.secondaryColor} />
            </div>
          </div>
          ); })()}

          {subPhase==="intro" && (()=>{
            const isFinalMatch = /(^|—\s)Final$/i.test((pendingMatch.competition||"").trim());
            return (
            <div className={`card p-6 text-center relative overflow-hidden ${isFinalMatch?"border-2":""}`} style={isFinalMatch?{borderColor:"#B8892E"}:{}}>
              {isFinalMatch && <div className="absolute inset-0 opacity-[0.12] pointer-events-none" style={{background:"linear-gradient(135deg, #B8892E, transparent 60%)"}} />}
              {isFinalMatch && <p className="relative font-display font-bold text-sm tracking-[0.2em] mb-3" style={{color:"#B8892E"}}>🏆 É DECISÃO — {pendingMatch.competition.toUpperCase()} 🏆</p>}
              <p className="text-steel-300 mb-2 relative">{pendingMatch.isHome?"Jogo em casa":"Jogo fora de casa"} contra o {pendingMatch.opponentClub.name}.</p>
              <p className="text-xs text-steel-400 mb-2 relative">Mando de campo: {pendingMatch.isHome?player.club.name:pendingMatch.opponentClub.name} · Competição: {pendingMatch.competition}</p>
              {isFinalMatch && <p className="text-xs mb-2 relative" style={{color:"#B8892E"}}>Tudo o que você fez até aqui te trouxe pra este jogo. É agora ou nunca.</p>}
              {pendingMatch.startsOnBench && <p className="text-xs text-state-warn mb-4 relative">Você começa no banco de reservas. Acompanhe o primeiro tempo até ser chamado.</p>}
              <button className="btn-primary relative" onClick={startMatch}>{isFinalMatch?"Entrar em campo para a decisão":"Começar a partida"}</button>
            </div>
            );
          })()}

          {subPhase==="auto" && currentTick && (
            <div className="card p-6 text-center fade-in">
              <span className="eyebrow">{beat.minute}'</span>
              <p className={`font-display text-lg mt-2 mb-2 ${currentTick.kind.includes("Goal")?"text-state-up":"text-steel-100"}`}>{currentTick.text}</p>
              {crowdLine && <p className="text-xs text-steel-400 italic mb-4">{crowdLine}</p>}
              {currentTick.reaction ? (
                <div className="grid gap-2 mt-4 text-left">
                  {currentTick.reaction.map(r=>(
                    <button key={r.id} onClick={()=>reactToGoal(r)} className="p-3 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 transition-colors text-sm text-steel-100">
                      {r.label}
                    </button>
                  ))}
                </div>
              ) : (
                <button className="btn-primary mt-2" onClick={continueFromAuto}>Continuar</button>
              )}
            </div>
          )}

          {subPhase==="halftime" && (
            <div className="card p-6 text-center fade-in">
              <span className="eyebrow">Intervalo</span>
              <h2 className="font-display text-2xl font-semibold text-steel-100 mt-2 mb-4">{homeClub.name} {homeGoals} — {awayGoals} {awayClub.name}</h2>
              <p className="text-sm text-steel-400 mb-6">Os times vão para o vestiário. Segundo tempo a seguir.</p>
              <button className="btn-primary" onClick={continueFromHalftime}>Voltar para o segundo tempo</button>
            </div>
          )}

          {subPhase==="substitution" && (
            <div className="card p-6 text-center fade-in">
              <span className="eyebrow">Substituição</span>
              <h2 className="font-display text-xl font-semibold text-state-up mt-2 mb-4">Você entra em campo!</h2>
              <button className="btn-primary" onClick={continueFromSubstitution}>Continuar</button>
            </div>
          )}

          {subPhase==="choose" && beat && beat.moment && (
            <div className="card p-6 fade-in">
              <span className="eyebrow">{beat.minute}'</span>
              <p className="text-steel-100 mt-2 mb-6">{beat.moment.description}</p>
              <div className="grid gap-3">
                {beat.moment.options.map(opt=>{
                  const chance = computeSuccessChance(player, beat.moment, opt, opponentQuality);
                  const chanceColor = chance>=60?"text-state-up":chance>=40?"text-state-warn":"text-state-down";
                  return (
                    <button key={opt.id} onClick={()=>choose(opt.id)} className="text-left p-4 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 hover:-translate-y-0.5 transition-all">
                      <div className="flex items-center justify-between">
                        <p className="font-display font-semibold text-steel-100">{opt.label}</p>
                        <span className={`stat-num text-sm ${chanceColor}`}>{chance}%</span>
                      </div>
                      <div className="h-1.5 rounded-full bg-pitch-700 overflow-hidden mt-2 mb-2">
                        <div className={`h-full rounded-full ${chance>=60?"bg-state-up":chance>=40?"bg-state-warn":"bg-state-down"}`} style={{width:`${chance}%`}} />
                      </div>
                      <div className="flex items-center justify-between">
                        <p className="text-[11px] text-steel-400">Usa: {opt.usesAttributes.map(attrLabelMatch).join(", ")}</p>
                        <span className={`text-[10px] uppercase font-display px-2 py-0.5 rounded ${opt.risk==="alto"?"bg-state-down/10 text-state-down":opt.risk==="médio"?"bg-state-warn/10 text-state-warn":"bg-state-up/10 text-state-up"}`}>Risco {opt.risk}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {subPhase==="corner-choice" && pendingSetPiece && (
            <div className="card p-6 fade-in">
              <span className="eyebrow">{pendingSetPiece.kind==="penalty"?"Cobrança de pênalti":"Cobrança de falta"}</span>
              <p className="text-steel-100 mt-2 mb-6">Escolha o canto da cobrança. Confie no instinto — não dá pra saber o resultado antes de bater.</p>
              <div className="grid sm:grid-cols-3 gap-3">
                {["esquerdo","centro","direito"].map(corner=>{
                  const { profile } = computeSetPieceChance(player, pendingSetPiece.kind, corner);
                  return (
                    <button key={corner} onClick={()=>chooseCorner(corner)} className="text-left p-4 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 hover:-translate-y-0.5 transition-all">
                      <p className="font-display font-semibold text-steel-100 mb-1">{profile.label}</p>
                      <p className="text-[11px] text-steel-400 mt-2">{corner==="centro"?"Mais fácil de acertar, mas o goleiro reage melhor no meio do gol.":"Mais difícil de acertar, mas quase impossível de defender."}</p>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {subPhase==="rolling" && (
            <div className="card p-10 text-center fade-in">
              <div className="flex items-center justify-center gap-2 mb-4">
                <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:"0s"}} />
                <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:".15s"}} />
                <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:".3s"}} />
              </div>
              <p className="text-steel-400 text-sm">A jogada acontece...</p>
            </div>
          )}

          {subPhase==="resolved" && currentOutcome && (
            <div className="card p-6 text-center fade-in">
              <p className={`font-display text-lg mb-2 ${currentOutcome.success?"text-state-up":"text-steel-200"}`}>{currentOutcome.text}</p>
              {crowdLine && <p className="text-xs text-steel-400 italic mb-4">{crowdLine}</p>}
              <button className="btn-primary mt-2" onClick={continueFromDecision}>Continuar partida</button>
            </div>
          )}

          {subPhase==="fulltime" && (
            <div className="card p-6 text-center">
              <span className="eyebrow">Fim de jogo</span>
              <h2 className="font-display text-2xl font-semibold text-steel-100 mt-2 mb-2">{homeClub.name} {homeGoals} — {awayGoals} {awayClub.name}</h2>
              {(() => {
                const previewRating = computeMatchRating(outcomes);
                const ratingColor = previewRating>=8?"text-crest-gold":previewRating>=6.5?"text-state-up":previewRating>=5?"text-steel-200":"text-state-down";
                return <p className={`stat-num text-3xl mb-2 ${ratingColor}`}>Nota {previewRating}</p>;
              })()}
              <p className="text-sm text-steel-400 mb-1">{outcomes.filter(o=>o.goal).length} gol(s) seu(s) · {outcomes.filter(o=>o.assist).length} assistência(s) · {outcomes.filter(o=>o.save||o.defense).length} ação(ões) decisiva(s)</p>
              <p className="text-sm text-steel-400 mb-6">{outcomes.filter(o=>o.success).length} de {outcomes.length} decisões bem resolvidas em campo.</p>
              {outcomes.some(o=>o.card==="vermelho") && <p className="text-sm text-state-down mb-4">Você foi expulso e vai cumprir suspensão.</p>}
              {pendingMatch.isCup && pendingMatch.isKnockout && homeGoals===awayGoals ? (
                <button className="btn-primary" onClick={startShootout}>Decidir nos pênaltis</button>
              ) : (
                <button className="btn-primary" onClick={goToPress}>Encerrar partida</button>
              )}
            </div>
          )}

          {subPhase==="penalties" && shootout && (
            <div className="card p-6 text-center fade-in">
              <span className="eyebrow">Disputa de pênaltis</span>
              <h2 className="font-display text-3xl font-bold text-steel-100 mt-2 mb-1 stat-num">
                {shootout.homeKicks.filter(Boolean).length} — {shootout.awayKicks.filter(Boolean).length}
              </h2>
              <p className="text-xs text-steel-400 mb-5">{homeClub.name} {shootout.homeKicks.map(k=>k?"●":"○").join(" ")} · {shootout.awayKicks.map(k=>k?"●":"○").join(" ")} {awayClub.name}</p>

              {shootout.done && shootoutKickPhase==="ready" ? (
                <>
                  <p className="font-display text-lg text-steel-100 mb-6">
                    {(shootout.winnerSide==="home")===pendingMatch.isHome ? "Você vence a disputa de pênaltis!" : "Vocês perdem a disputa de pênaltis."}
                  </p>
                  <button className="btn-primary" onClick={goToPress}>Continuar</button>
                </>
              ) : shootoutKickPhase==="rolling" ? (
                <div className="py-6">
                  <div className="flex items-center justify-center gap-2 mb-4">
                    <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:"0s"}} />
                    <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:".15s"}} />
                    <span className="w-2.5 h-2.5 rounded-full bg-touchline pulse-dot" style={{animationDelay:".3s"}} />
                  </div>
                  <p className="text-steel-400 text-sm">A cobrança acontece...</p>
                </div>
              ) : shootoutKickPhase==="revealed" ? (
                <div className={lastKickText && lastKickText.startsWith("GOL") ? "pop-in" : "shake"}>
                  <p className={`font-display text-lg mb-6 ${lastKickText && lastKickText.startsWith("GOL")?"text-state-up":"text-steel-200"}`}>{lastKickText}</p>
                  <button className="btn-primary" onClick={continueShootoutKick}>Continuar</button>
                </div>
              ) : (shootout.turn==="home")===pendingMatch.isHome ? (
                <div className="grid sm:grid-cols-3 gap-3">
                  {["esquerdo","centro","direito"].map(corner=>{
                    const { profile } = computeSetPieceChance(player, "penalty", corner);
                    return (
                      <button key={corner} onClick={()=>takePlayerShootoutKick(corner)} className="text-left p-4 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 hover:-translate-y-0.5 transition-all">
                        <p className="font-display font-semibold text-steel-100 mb-1">{profile.label}</p>
                      </button>
                    );
                  })}
                </div>
              ) : (
                <button className="btn-primary" onClick={takeOpponentShootoutKick}>Cobrança do {(shootout.turn==="home")?homeClub.name:awayClub.name}</button>
              )}
            </div>
          )}

          {subPhase==="press" && pendingResult && pressScenario && (
            <div className="card p-6 fade-in">
              <span className="eyebrow">Sala de imprensa</span>
              <p className="text-steel-100 mt-2 mb-6">"{pressScenario.scenario.question}"</p>
              <div className="grid gap-3">
                {pressScenario.scenario.answers.map(a=>(
                  <button key={a.id} disabled={pressAnswered} onClick={()=>{ setPressAnswered(true); finalizeAfterPress(a); }}
                    className="text-left p-4 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 transition-colors disabled:opacity-50">
                    <p className="text-steel-100">{a.label}</p>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* linha do tempo */}
          {log.length>0 && (
            <div className="card p-4 mt-4">
              <h3 className="eyebrow mb-3">Linha do tempo</h3>
              <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                {log.map((l,i)=>(
                  <div key={i} className="flex gap-3 text-xs">
                    <span className="stat-num text-steel-400 w-8 shrink-0">{l.minute}'</span>
                    <span className="text-steel-300">{l.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* sidebar: campo + estatísticas + outros jogos */}
        <div className="space-y-4">
          {!["intro","fulltime","press"].includes(subPhase) && (
            <div className="card p-3">
              <div className="grid grid-cols-2 gap-2 mb-3">
                <FormationPitch club={homeClub} isPlayerTeam={pendingMatch.isHome} playerPosition={player.position} squad={pendingMatch.isHome?player.squad:null} flip={false} compact={false} ballEvent={ballAnim && ballAnim.side==="home" ? ballAnim : null} />
                <FormationPitch club={awayClub} isPlayerTeam={!pendingMatch.isHome} playerPosition={player.position} squad={!pendingMatch.isHome?player.squad:null} flip={true} compact={false} ballEvent={ballAnim && ballAnim.side==="away" ? ballAnim : null} />
              </div>
              <MatchStatsBar stats={matchStats} homeClub={homeClub} awayClub={awayClub} />
            </div>
          )}
          <div className="card p-4">
            <h3 className="eyebrow mb-3">Outros jogos da rodada</h3>
            <div className="space-y-2.5">
              {otherGames.length===0 && <p className="text-xs text-steel-400">Nenhum outro jogo nesta rodada.</p>}
              {otherGames.map((g,i)=>(
                <div key={i} className="text-xs">
                  <div className="flex items-center justify-between">
                    <span className="flex items-center gap-1.5 text-steel-300 truncate pr-2">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:g.home.primaryColor}} />
                      {g.home.name}
                    </span>
                    <span className="stat-num text-steel-100 shrink-0">{g.homeGoals}</span>
                  </div>
                  <div className="flex items-center justify-between">
                    <span className="flex items-center gap-1.5 text-steel-300 truncate pr-2">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:g.away.primaryColor}} />
                      {g.away.name}
                    </span>
                    <span className="stat-num text-steel-100 shrink-0">{g.awayGoals}</span>
                  </div>
                  <p className="text-[10px] text-steel-400 mt-0.5">{g.minute>0?`${g.minute}'`:"a começar"}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="card p-4">
            <button className="eyebrow mb-3 flex items-center justify-between w-full" onClick={()=>setShowTopScorers(v=>!v)}>
              <span>Artilharia do campeonato</span>
              <span className="text-steel-400">{showTopScorers?"−":"+"}</span>
            </button>
            {showTopScorers && (
              <div className="space-y-1.5">
                {topScorers.map((s,i)=>(
                  <div key={i} className={`flex items-center justify-between text-xs gap-2 ${s.isPlayer?"text-touchline font-semibold":"text-steel-300"}`}>
                    <span className="truncate min-w-0"><span className="shrink-0">{i+1}. {s.name}</span><span className="text-steel-400 font-normal"> — {s.club}</span></span>
                    <span className="stat-num shrink-0">{s.goals}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value }){
  return <div className="card p-3"><p className="stat-num text-xl text-steel-100">{value}</p><p className="text-[10px] text-steel-400 uppercase tracking-wide mt-0.5">{label}</p></div>;
}

function TransferOfferCard({ offer, onAccept, onReject }){
  const isLoan = offer.type==="emprestimo";
  return (
    <div className="card p-4">
      <div className="flex items-center gap-3 mb-3">
        <div className="w-9 h-9 rounded-lg flex items-center justify-center font-display font-bold text-xs shrink-0" style={{backgroundColor:offer.club.primaryColor,color:offer.club.secondaryColor}}>
          {offer.club.name.split(" ").map(w=>w[0]).slice(0,2).join("")}
        </div>
        <div className="flex-1">
          <p className="font-display font-semibold text-steel-100">{offer.club.name}</p>
          <p className="text-xs text-steel-400">{offer.club.league}</p>
        </div>
        <span className={`text-[10px] font-display uppercase px-2 py-1 rounded shrink-0 ${isLoan?"bg-touchline/15 text-touchline":"bg-state-up/15 text-state-up"}`}>{isLoan?"Empréstimo":"Compra"}</span>
      </div>
      <div className="grid grid-cols-2 gap-2 text-xs text-steel-300 mb-4">
        <p>Salário/semana: <span className="text-steel-100 font-mono">€{offer.salaryPerWeek.toLocaleString("pt-BR")}</span></p>
        <p>Contrato: <span className="text-steel-100">{offer.durationSeasons} temporada{offer.durationSeasons>1?"s":""}</span></p>
        <p>Papel no elenco: <span className="text-steel-100">{offer.squadRole}</span></p>
        <p>Chance de titularidade: <span className="text-steel-100">{offer.startingChance}%</span></p>
      </div>
      <div className="flex gap-2">
        <button className="btn-primary !py-2 flex-1 text-xs" onClick={()=>onAccept(offer)}>Aceitar</button>
        <button className="btn-secondary !py-2 flex-1 text-xs" onClick={()=>onReject(offer)}>Recusar</button>
      </div>
    </div>
  );
}

function SeasonSummaryPage(){
  const { career, setCareer, setScreen, transferOffers, setTransferOffers } = useCareer();
  if(!career) return null;
  const lastSeason = career.player.seasons[career.player.seasons.length-1];
  if(!lastSeason){ setScreen("dashboard"); return null; }
  const overallDelta = lastSeason.overallEnd - lastSeason.overallStart;
  const seasonAwards = career.player.achievements.filter(a=>a.season===lastSeason.season);
  const seasonMilestones = career.player.milestones.filter(m=>m.season===lastSeason.season);
  const callUpMilestone = seasonMilestones.find(m=>m.tag==="seleção");
  const gotCallUp = !!callUpMilestone;
  const divisionMilestone = seasonMilestones.find(m=>m.tag==="rebaixamento"||m.tag==="acesso");
  const qualificationMilestone = seasonMilestones.find(m=>m.tag==="classificação");

  function acceptOffer(offer){
    const newClub = offer.club;
    const newCoach = generateCoach(newClub);
    const newSquad = generateSquad(newClub);
    const newCalendar = buildCalendar(newClub, career.quickMode);
    const updatedHistory = career.player.clubHistory.map((h,i)=> i===career.player.clubHistory.length-1 ? {...h, toSeason:career.currentSeason-1} : h);
    updatedHistory.push({ clubId:newClub.id, clubName:newClub.name, fromSeason:career.currentSeason });
    const news = newsFromTransfer(career.player, career.player.club, newClub, career.currentSeason);
    let updatedPlayer = { ...career.player, club:newClub, clubHistory:updatedHistory, squad:newSquad, coachTrust:50, weeklySalary:offer.salaryPerWeek,
      reputation:{...career.player.reputation, club:35}, newsLog:[news, ...career.player.newsLog].slice(0,40) };
    updatedPlayer = addMilestone(updatedPlayer, `Transferência confirmada: rumo ao ${newClub.name}.`, career.currentSeason, "transferência");
    const builtCups = buildSeasonCups(newClub);
    const totalLeagueWeeks = newCalendar.rounds.length*2;
    const newCup = scheduleCupWeeks(builtCups.cup, totalLeagueWeeks, 0);
    const newContinentalCup = builtCups.continentalCup ? scheduleContinentalWeeks(builtCups.continentalCup, totalLeagueWeeks, 4) : null;
    setCareer({ ...career, player:updatedPlayer, currentCoach:newCoach, calendar:newCalendar, cup:newCup, continentalCup:newContinentalCup,
      seasonProgress:{ ...career.seasonProgress, matchesTotal:newCalendar.matchesTotal } });
    setTransferOffers([]);
    setScreen("dashboard");
  }
  function rejectOffer(offer){ setTransferOffers(transferOffers.filter(o=>o.id!==offer.id)); }

  return (
    <div className="min-h-screen bg-pitch-950 flex flex-col items-center px-4 py-10">
      <div className="max-w-lg w-full text-center">
        <span className="eyebrow">Fim da temporada {lastSeason.season}</span>
        <h1 className="font-display text-3xl font-bold text-steel-100 mt-1 mb-8">{career.player.firstName} {career.player.lastName}</h1>
        <div className="flex justify-center mb-8"><OverallCircle value={lastSeason.overallEnd} delta={overallDelta} size={140} /></div>
        <div className="grid grid-cols-3 gap-4 mb-8">
          <Stat label="Jogos" value={lastSeason.matches} /><Stat label="Gols" value={lastSeason.goals} /><Stat label="Assistências" value={lastSeason.assists} />
          <Stat label="Nota média" value={lastSeason.averageRating} /><Stat label="Cartões amarelos" value={lastSeason.yellowCards} /><Stat label="Lesões" value={lastSeason.injuries} />
        </div>
        <p className="text-sm text-steel-400 mb-8">Valor de mercado estimado: <span className="text-steel-100 font-display">{lastSeason.marketValue.toLocaleString("pt-BR",{style:"currency",currency:"EUR",maximumFractionDigits:0})}</span></p>

        {(seasonAwards.length>0 || gotCallUp || divisionMilestone || qualificationMilestone) && (
          <div className="text-left mb-8">
            <h3 className="font-display font-semibold text-steel-100 mb-3">Destaques da temporada</h3>
            <div className="grid gap-2">
              {seasonAwards.map(a=>(
                <div key={a.id} className={`card p-3 border-l-2 flex items-center gap-3 ${a.id==="campeao"?"bg-crest-gold/5 border-crest-gold":"border-crest-gold/60"}`}>
                  <span className="text-xl">{a.icon||"🏆"}</span>
                  <div><p className="font-display font-semibold text-steel-100 text-sm">{a.title}</p><p className="text-xs text-steel-400">{a.description}</p></div>
                </div>
              ))}
              {seasonAwards.some(a=>a.id==="campeao") && (
                <div className="text-center py-2 text-2xl tracking-wide pop-in">🚀 🎉 🏆 🎉 🚀</div>
              )}
              {gotCallUp && (
                <div className="card p-3 border-l-2 border-touchline/60 flex items-center gap-3">
                  <span className="text-xl">🌍</span>
                  <div><p className="font-display font-semibold text-steel-100 text-sm">Convocação para a seleção</p><p className="text-xs text-steel-400">{callUpMilestone.text}</p></div>
                </div>
              )}
              {divisionMilestone && (
                <div className={`card p-3 border-l-2 flex items-center gap-3 ${divisionMilestone.tag==="acesso"?"border-state-up/60":"border-state-down/60"}`}>
                  <span className="text-xl">{divisionMilestone.tag==="acesso"?"⬆️":"⬇️"}</span>
                  <div><p className="font-display font-semibold text-steel-100 text-sm">{divisionMilestone.tag==="acesso"?"Acesso":"Rebaixamento"}</p><p className="text-xs text-steel-400">{divisionMilestone.text}</p></div>
                </div>
              )}
              {qualificationMilestone && (
                <div className="card p-3 border-l-2 border-crest-gold/60 flex items-center gap-3">
                  <span className="text-xl">🎟️</span>
                  <div><p className="font-display font-semibold text-steel-100 text-sm">Classificação continental</p><p className="text-xs text-steel-400">{qualificationMilestone.text}</p></div>
                </div>
              )}
            </div>
          </div>
        )}

        {transferOffers.length>0 && (
          <div className="text-left mb-8">
            <h3 className="font-display font-semibold text-steel-100 mb-3">Mercado da transferência</h3>
            <div className="grid sm:grid-cols-2 gap-3">
              {transferOffers.map(o=> <TransferOfferCard key={o.id} offer={o} onAccept={acceptOffer} onReject={rejectOffer} />)}
            </div>
          </div>
        )}

        <button className="btn-primary" onClick={()=>{ setTransferOffers([]); setScreen("dashboard"); }}>{transferOffers.length>0?`Permanecer no ${career.player.club.name}`:`Iniciar temporada ${career.currentSeason}`}</button>
      </div>
    </div>
  );
}

// ============================================================
// APOSENTADORIA
// ============================================================
const REASON_LABEL = { idade:"a idade", "queda de nível":"a queda de rendimento", "lesões":"o histórico de lesões" };
function computeLegacy(peakOverall, titles, seasons){
  if(peakOverall>=92 && titles>=3) return "Lenda mundial";
  if(peakOverall>=85) return "Ídolo nacional";
  if(peakOverall>=78) return "Ídolo de um clube";
  if(peakOverall>=70) return "Profissional exemplar";
  if(seasons<=3) return "Grande promessa que não vingou";
  return "Jogador comum, mas com uma bela história para contar";
}
function CareerTimeline({ milestones }){
  const TAG_ICONS = { "título":"🏆","seleção":"🌍","transferência":"🔁","classificação":"🎟️","prêmio":"⭐","atuação":"🔥","rebaixamento":"⬇️","acesso":"⬆️","vida pessoal":"❤️" };
  const sorted = [...milestones].reverse();
  return (
    <div className="relative pl-6">
      <div className="absolute left-[7px] top-1 bottom-1 w-0.5 bg-pitch-700" />
      <div className="space-y-4">
        {sorted.map(m=>(
          <div key={m.id} className="relative">
            <div className="absolute -left-6 top-0.5 w-3.5 h-3.5 rounded-full border-2 border-crest-gold bg-pitch-900 flex items-center justify-center text-[8px]">{TAG_ICONS[m.tag]||"•"}</div>
            <p className="text-[10px] text-crest-gold font-display uppercase tracking-wide">Temporada {m.season}</p>
            <p className="text-sm text-steel-300">{m.text}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function RetirementPage(){
  const { career, setScreen } = useCareer();
  if(!career) return null;
  const { player } = career;
  const totalGoals = player.seasons.reduce((s,x)=>s+x.goals,0);
  const totalAssists = player.seasons.reduce((s,x)=>s+x.assists,0);
  const totalMatches = player.seasons.reduce((s,x)=>s+x.matches,0);
  const peakOverall = Math.max(player.overall, ...player.seasons.map(s=>s.overallEnd), 0);
  const legacy = computeLegacy(peakOverall, player.achievements.length, player.seasons.length);

  return (
    <div className="min-h-screen bg-pitch-950 flex flex-col items-center px-4 py-14">
      <div className="max-w-xl w-full text-center">
        <div className="flex justify-center mb-4">
          <div className="rounded-xl overflow-hidden bg-pitch-850 border border-pitch-700 p-2">
            <PlayerAvatar appearance={player.appearance} club={player.club} number={player.preferredNumber} position={player.position} size={100} />
          </div>
        </div>
        <span className="eyebrow">Fim de carreira</span>
        <h1 className="font-display text-4xl font-bold text-steel-100 mt-2 mb-2">{player.firstName} {player.lastName}</h1>
        <p className="text-steel-400 mb-1">Aposentado aos {player.age} anos, por {REASON_LABEL[career.retirementReason]||"decisão pessoal"}.</p>
        <p className="text-crest-gold font-display text-lg mb-10">{legacy}</p>
        <div className="grid grid-cols-3 gap-4 mb-10">
          <Stat label="Temporadas" value={player.seasons.length} /><Stat label="Jogos" value={totalMatches} /><Stat label="Gols" value={totalGoals} />
          <Stat label="Assistências" value={totalAssists} /><Stat label="Overall máximo" value={peakOverall} /><Stat label="Clubes" value={player.clubHistory.length} />
          {(player.caps>0) && <><Stat label="Convocações" value={player.caps} /><Stat label="Gols pela seleção" value={player.interGoals} /></>}
        </div>
        {player.achievements && player.achievements.length>0 && (
          <div className="card p-5 text-left mb-6">
            <h3 className="font-display font-semibold text-steel-100 mb-3">Prêmios da carreira</h3>
            <ul className="space-y-2 text-sm text-steel-300">
              {player.achievements.map((a,i)=>(<li key={i} className="flex gap-2"><span>{a.icon||"🏆"}</span><span>{a.title} — Temporada {a.season}</span></li>))}
            </ul>
          </div>
        )}
        <div className="card p-5 text-left mb-6">
          <h3 className="font-display font-semibold text-steel-100 mb-3">Passagem por clubes</h3>
          <ul className="space-y-1 text-sm text-steel-300">
            {player.clubHistory.map((stint,i)=>(<li key={i}>{stint.clubName} — temporada{stint.toSeason?`s ${stint.fromSeason} a ${stint.toSeason}`:` ${stint.fromSeason} em diante`}</li>))}
          </ul>
        </div>
        {player.milestones && player.milestones.length>0 && (
          <div className="card p-5 text-left mb-10">
            <h3 className="font-display font-semibold text-steel-100 mb-4">Momentos que ficaram na memória</h3>
            <CareerTimeline milestones={player.milestones} />
          </div>
        )}
        <div className="flex justify-center gap-3">
          <button className="btn-secondary" onClick={()=>exportCareer(career)}>Exportar retrospectiva</button>
          <button className="btn-primary" onClick={()=>setScreen("start")}>Nova carreira</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// ROTEADOR / APP
// ============================================================
function Router(){
  const { screen } = useCareer();
  switch(screen){
    case "start": return <StartScreen />;
    case "creation": return <PlayerCreationPage />;
    case "club-selection": return <ClubSelectionPage />;
    case "dashboard": return <DashboardPage />;
    case "match": return <MatchPage />;
    case "season-summary": return <SeasonSummaryPage />;
    case "retirement": return <RetirementPage />;
    default: return <StartScreen />;
  }
}
function App(){
  return <CareerProvider><Router /></CareerProvider>;
}

// Rede de segurança: se algum bug futuro quebrar uma tela específica (em vez de deixar a página inteira
// em branco), mostra um aviso com a opção de voltar ao painel e exportar a carreira antes de continuar.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false, message:"" }; }
  static getDerivedStateFromError(err){ return { hasError:true, message: (err && err.message) || "Erro desconhecido" }; }
  componentDidCatch(err, info){ console.error("Erro capturado pela ErrorBoundary:", err, info); }
  render(){
    if(this.state.hasError){
      return (
        <div style={{minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", background:"#EEF2EE", padding:"24px", textAlign:"center", gap:"14px"}}>
          <p style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:"22px", color:"#0E1512"}}>Algo deu errado nessa tela</p>
          <p style={{fontFamily:"'Inter',sans-serif", fontSize:"13px", color:"#5B6B60", maxWidth:"420px"}}>
            Um erro inesperado travou essa parte do jogo, mas sua carreira continua salva na memória do navegador.
            Recarregue a página — se o problema persistir na mesma tela, use "Exportar carreira" assim que possível para não perder o progresso.
          </p>
          <p style={{fontFamily:"monospace", fontSize:"11px", color:"#B03030", background:"#FBEAEA", padding:"8px 12px", borderRadius:"6px", maxWidth:"90vw", overflowWrap:"anywhere"}}>{this.state.message}</p>
          <button onClick={()=>window.location.reload()} style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, background:"#155FD1", color:"#fff", border:"none", borderRadius:"8px", padding:"10px 24px", cursor:"pointer"}}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

<script>
  // Transformação manual (em vez de deixar o Babel escanear o script sozinho):
  // força o runtime "classic" do JSX, compatível com o React carregado via CDN global.
  // Isso evita um bug de versões recentes do Babel Standalone que injetam um
  // `import` automático do jsx-runtime, o que quebra fora de um <script type="module">.
  window.addEventListener("DOMContentLoaded", function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      var script = document.createElement("script");
      script.text = compiled;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#E5484D;padding:24px;white-space:pre-wrap;font-family:monospace;">Erro ao iniciar o jogo:\n' +
        (err && err.message ? err.message : err) + "</pre>";
      console.error(err);
    }
  });
</script>
</body>
