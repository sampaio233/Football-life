function DashboardPage(){
  const { career, setCareer, setScreen, setPendingMatch, transferOffers, setTransferOffers } = useCareer();
  const [attrTab, setAttrTab] = useState("Técnicos");
  const [showAllNews, setShowAllNews] = useState(false);
  const [showStandings, setShowStandings] = useState(false);
  const [coachChat, setCoachChat] = useState(null);
  const [requestedOffers, setRequestedOffers] = useState(null);
  const [requestingTransfer, setRequestingTransfer] = useState(false);
  const [showFullSquad, setShowFullSquad] = useState(false);
  const [showShop, setShowShop] = useState(false);
  const [cupDetailsOpen, setCupDetailsOpen] = useState(null);
  const [relationshipEvent, setRelationshipEvent] = useState(null);

  useEffect(()=>{
    if(!career) return;
    const isMatchWeek = career.weekIndex % 2 === 1;
    const activeInjury = career.player.injuries.find(i=>i.weeksRemaining>0);
    if(!isMatchWeek && !activeInjury && !coachChat && Math.random()<0.3){
      setCoachChat(pick(COACH_TALK_OPENERS));
    }
    if(!isMatchWeek && !activeInjury && !relationshipEvent && Math.random()<0.14){
      const status = career.player.relationshipStatus||"solteiro";
      setRelationshipEvent(RELATIONSHIP_EVENTS[status]);
    }
    // eslint-disable-next-line
  }, [career && career.weekIndex]);

  if(!career) return null;
  const { player, currentCoach, seasonProgress, calendar } = career;
  const careerGoals = player.seasons.reduce((s,x)=>s+x.goals,0);
  const careerAssists = player.seasons.reduce((s,x)=>s+x.assists,0);
  const careerMatches = player.seasons.reduce((s,x)=>s+x.matches,0);
  const activeInjury = player.injuries.find(i=>i.weeksRemaining>0);
  const isSuspended = player.suspendedMatches > 0;
  const currentRoundIdx = Math.floor(career.weekIndex/2);
  const isMatchWeek = career.weekIndex % 2 === 1 && seasonProgress.matchesPlayed < seasonProgress.matchesTotal;
  const fixture = isMatchWeek ? findPlayerFixture(calendar, player.club.id, currentRoundIdx) : null;
  const isByeWeek = isMatchWeek && !fixture;
  const matchRole = fixture ? determineMatchRole(player) : "titular";
  const domesticCupTie = (!isMatchWeek && career.cup && !career.cup.eliminated && !career.cup.champion && career.cup.scheduledWeeks.includes(career.weekIndex))
    ? findPlayerCupTie(career.cup) : null;
  const continentalCupTie = (!domesticCupTie && !isMatchWeek && career.continentalCup && !career.continentalCup.eliminated && !career.continentalCup.champion && career.continentalCup.scheduledWeeks.includes(career.weekIndex))
    ? findPlayerContinentalTie(career.continentalCup) : null;
  const cupTie = domesticCupTie || continentalCupTie;
  const cupKey = domesticCupTie ? "cup" : "continentalCup";
  const activeCup = domesticCupTie ? career.cup : career.continentalCup;
  const worldCupTie = (!isMatchWeek && career.worldCup && !career.worldCup.champion && !career.worldCup.eliminated && career.worldCup.scheduledWeeks.includes(career.weekIndex))
    ? findPlayerContinentalTie(career.worldCup) : null;
  const nationalMatchDue = (!isMatchWeek && !cupTie && !worldCupTie && career.nationalTeam && career.nationalTeam.matchesRemaining>0 && career.nationalTeam.scheduledWeeks.includes(career.weekIndex));
  const isTrainingWeek = !isMatchWeek && !activeInjury && !cupTie && !nationalMatchDue && !worldCupTie;

  function persist(updater){ setCareer(updater(career)); }

  function respondCoachChat(r){
    const updatedPlayer = { ...player, coachTrust: Math.min(100, Math.max(0, player.coachTrust + r.coachTrust)), morale: Math.min(100, Math.max(0, player.morale + r.morale)) };
    persist(c=>({ ...c, player: updatedPlayer }));
    setCoachChat(null);
  }

  function respondRelationshipEvent(option){
    let updatedPlayer = { ...player, relationshipStatus: option.next, morale: Math.min(100, Math.max(0, player.morale + option.moral)) };
    if(option.id==="flirt"){
      updatedPlayer.partnerName = pick(DATING_NAMES);
      updatedPlayer = addMilestone(updatedPlayer, `Começou a namorar ${updatedPlayer.partnerName}.`, career.currentSeason, "vida pessoal");
      const news = newsFromPersonalChoice(updatedPlayer, `Novo affair de ${player.firstName}`, true, career.currentSeason);
      updatedPlayer.newsLog = [news, ...updatedPlayer.newsLog].slice(0,40);
    } else if(option.id==="propose"){
      updatedPlayer = addMilestone(updatedPlayer, `Ficou noivo de ${player.partnerName}.`, career.currentSeason, "vida pessoal");
    } else if(option.id==="marry"){
      updatedPlayer = addMilestone(updatedPlayer, `Casou-se com ${player.partnerName}.`, career.currentSeason, "vida pessoal");
      const news = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"programa", headline:`${player.firstName} ${player.lastName} se casa com ${player.partnerName}`,
        summary:"Cerimônia reúne familiares, companheiros de time e amigos próximos.", date:`Temporada ${career.currentSeason}`, impact:10, season:career.currentSeason };
      updatedPlayer.newsLog = [news, ...updatedPlayer.newsLog].slice(0,40);
    } else if(option.child){
      const childName = pick(DATING_NAMES.concat(["Miguel","Davi","Arthur","Théo","Heitor","Bernardo"]));
      updatedPlayer.children = [...(player.children||[]), { name:childName, bornSeason:career.currentSeason }];
      updatedPlayer = addMilestone(updatedPlayer, `Recebeu ${childName}, seu primeiro filho, em casa.`, career.currentSeason, "vida pessoal");
    }
    persist(c=>({ ...c, player: updatedPlayer }));
    setRelationshipEvent(null);
  }

  function buyItem(item){
    if(player.money < item.cost) return;
    const updatedPlayer = { ...player, money: player.money-item.cost,
      possessions: [...(player.possessions||[]), { ...item, boughtSeason:career.currentSeason }],
      morale: Math.min(100, player.morale+item.moral), reputation:{...player.reputation, fans:Math.min(100, player.reputation.fans+item.popularity)} };
    persist(c=>({ ...c, player: updatedPlayer }));
  }

  function goToMatch(){
    setPendingMatch({ opponentClub: fixture.home.id===player.club.id ? fixture.away : fixture.home, isHome: fixture.home.id===player.club.id, competition: player.club.league, startsOnBench: matchRole==="banco" });
    setScreen("match");
  }

  function skipUnselectedMatch(){
    const auto = autoResolveCurrentWeek();
    const updatedPlayer = payWeeklySalary({ ...player, morale: Math.max(0, player.morale-3) });
    const nextSeasonProgress = { ...seasonProgress, matchesPlayed:seasonProgress.matchesPlayed+auto.matchesPlayedDelta };
    if(auto.matchesPlayedDelta>0 && nextSeasonProgress.matchesPlayed>=nextSeasonProgress.matchesTotal){
      const { newCareer, screen, transferOffers } = finishSeason({ ...career, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }, updatedPlayer, nextSeasonProgress);
      setTransferOffers(transferOffers); setCareer(newCareer); setScreen(screen);
      return;
    }
    persist(c=>({ ...c, player:updatedPlayer, weekIndex:c.weekIndex+1, seasonProgress:nextSeasonProgress, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }));
  }

  function goToCupMatch(){
    const tie = cupTie;
    const isKnockout = cupKey==="cup" || activeCup.phase==="final";
    const roundName = cupKey==="cup" ? cupRoundName(activeCup.rounds[activeCup.currentRoundIdx].length*2) : continentalRoundLabel(activeCup);
    setPendingMatch({ opponentClub: tie.home.id===player.club.id ? tie.away : tie.home, isHome: tie.home.id===player.club.id,
      competition: `${activeCup.name} — ${roundName}`, isCup:true, cupKey, isKnockout });
    setScreen("match");
  }

  function goToNationalMatch(){
    const opponent = generateNationalOpponent(player.nationality);
    setPendingMatch({ opponentClub: opponent, isHome: Math.random()<0.5, competition:"Amistoso Internacional", isNational:true, playerTeamClub: buildPlayerNationalTeamClub(player) });
    setScreen("match");
  }

  function goToWorldCupMatch(){
    const tie = worldCupTie;
    const roundName = continentalRoundLabel(career.worldCup);
    const playerNT = buildPlayerNationalTeamClub(player);
    setPendingMatch({ opponentClub: tie.home.id===career.worldCup.playerClubId ? tie.away : tie.home, isHome: tie.home.id===career.worldCup.playerClubId,
      competition: `Copa do Mundo — ${roundName}`, isWorldCup:true, isKnockout: career.worldCup.phase==="final", playerTeamClub: playerNT });
    setScreen("match");
  }

  function skipByeWeek(){
    simulateRoundExceptClub(calendar, currentRoundIdx, player.club.id);
    const updatedPlayer = payWeeklySalary(player);
    persist(c=>({ ...c, player:updatedPlayer, weekIndex:c.weekIndex+1, calendar:{...calendar} }));
  }

  function handleTraining(optionId){
    const result = applyTraining(player, currentCoach.trainingQuality, optionId);
    let updatedPlayer = result.player;
    let updatedNews = [...updatedPlayer.newsLog];

    if(optionId==="party" && result.injuryOccurred){
      updatedPlayer = { ...updatedPlayer, reputation:{...updatedPlayer.reputation, press:Math.max(0,updatedPlayer.reputation.press-8)}, morale:Math.max(0,updatedPlayer.morale-6) };
      updatedNews = [newsFromPersonalChoice(updatedPlayer,"Balada com os companheiros",false,career.currentSeason), ...updatedNews];
    } else if(optionId!=="party" && result.injuryOccurred){
      const severity = Math.random()<0.5?"leve":Math.random()<0.85?"moderada":"grave";
      const weeksOut = severity==="leve"?2:severity==="moderada"?5:10;
      const injury = { id:`injury-${Date.now()}`, name: (optionId==="strength"||optionId==="speed")?"Lesão muscular":"Torção", severity, weeksOut, weeksRemaining:weeksOut,
        relapseRisk: severity==="grave"?35:15, affectedAttributes:(TRAINING_OPTIONS.find(o=>o.id===optionId)||{}).boostKeys||[], occurredSeason:career.currentSeason };
      updatedPlayer = { ...updatedPlayer, injuries:[...updatedPlayer.injuries, injury] };
      updatedNews = [newsFromInjury(updatedPlayer, career.currentSeason), ...updatedNews];
    }
    // Mundo vivo: às vezes surge notícia de outro clube, independente do que o jogador fez.
    if(Math.random()<0.3){
      const worldNews = newsFromWorld(calendar, player.club.id, career.currentSeason);
      if(worldNews) updatedNews = [worldNews, ...updatedNews];
    }
    updatedPlayer = payWeeklySalary({ ...updatedPlayer, newsLog: updatedNews.slice(0,40) });
    persist(c=>({ ...c, player:updatedPlayer, weekIndex:c.weekIndex+1,
      seasonProgress:{...c.seasonProgress, injuriesThisSeason:c.seasonProgress.injuriesThisSeason + (updatedPlayer.injuries.length>player.injuries.length?1:0)} }));
    setCoachChat(null);
  }

  function autoResolveCurrentWeek(){
    let matchesPlayedDelta = 0;
    if(fixture){
      const res = quickSimResult(fixture.home, fixture.away);
      applyResultToStandings(calendar.standings, fixture.home, fixture.away, res.homeGoals, res.awayGoals);
      matchesPlayedDelta = 1;
    } else if(isByeWeek){
      simulateRoundExceptClub(calendar, currentRoundIdx, player.club.id);
    }
    let updatedCup = career.cup, updatedContinentalCup = career.continentalCup, updatedWorldCup = career.worldCup;
    if(cupTie){
      const res2 = quickSimResult(cupTie.home, cupTie.away);
      const opponentClub = cupTie.home.id===player.club.id ? cupTie.away : cupTie.home;
      if(cupKey==="cup"){
        const isDraw = res2.homeGoals===res2.awayGoals;
        const wonNormally = cupTie.home.id===player.club.id ? res2.homeGoals>res2.awayGoals : res2.awayGoals>res2.homeGoals;
        const playerWon = wonNormally || (isDraw && Math.random()<0.5);
        updatedCup = advanceCup(activeCup, playerWon, player.club, opponentClub);
      } else if(activeCup.phase==="groups" || activeCup.phase==="semis"){
        updatedContinentalCup = advanceContinentalCup(activeCup, false, player.club, opponentClub, res2.homeGoals, res2.awayGoals);
      } else {
        const isDraw = res2.homeGoals===res2.awayGoals;
        const wonNormally = cupTie.home.id===player.club.id ? res2.homeGoals>res2.awayGoals : res2.awayGoals>res2.homeGoals;
        const playerWon = wonNormally || (isDraw && Math.random()<0.5);
        updatedContinentalCup = advanceContinentalCup(activeCup, playerWon, player.club, opponentClub);
      }
    }
    if(worldCupTie){
      const playerNT = buildPlayerNationalTeamClub(player);
      const res3 = quickSimResult(worldCupTie.home, worldCupTie.away);
      const opponentNT = worldCupTie.home.id===career.worldCup.playerClubId ? worldCupTie.away : worldCupTie.home;
      if(career.worldCup.phase==="groups" || career.worldCup.phase==="semis"){
        updatedWorldCup = advanceContinentalCup(career.worldCup, false, playerNT, opponentNT, res3.homeGoals, res3.awayGoals);
      } else {
        const isDraw = res3.homeGoals===res3.awayGoals;
        const wonNormally = worldCupTie.home.id===career.worldCup.playerClubId ? res3.homeGoals>res3.awayGoals : res3.awayGoals>res3.homeGoals;
        const playerWon = wonNormally || (isDraw && Math.random()<0.5);
        updatedWorldCup = advanceContinentalCup(career.worldCup, playerWon, playerNT, opponentNT);
      }
    }
    return { matchesPlayedDelta, calendar:{...calendar}, cup:updatedCup, continentalCup:updatedContinentalCup, worldCup:updatedWorldCup };
  }

  function advanceInjuryWeek(){
    const auto = autoResolveCurrentWeek();
    const updatedInjuries = player.injuries.map(i=> i.weeksRemaining>0 ? {...i, weeksRemaining:i.weeksRemaining-1} : i);
    const updatedPlayer = payWeeklySalary({ ...player, injuries:updatedInjuries, energy:Math.min(100, player.energy+15) });
    const nextSeasonProgress = { ...seasonProgress, matchesPlayed:seasonProgress.matchesPlayed+auto.matchesPlayedDelta };
    if(auto.matchesPlayedDelta>0 && nextSeasonProgress.matchesPlayed>=nextSeasonProgress.matchesTotal){
      const { newCareer, screen, transferOffers } = finishSeason({ ...career, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }, updatedPlayer, nextSeasonProgress);
      setTransferOffers(transferOffers); setCareer(newCareer); setScreen(screen);
      return;
    }
    persist(c=>({ ...c, player:updatedPlayer, weekIndex:c.weekIndex+1, seasonProgress:nextSeasonProgress, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }));
  }

  function playThroughSuspension(){
    const auto = autoResolveCurrentWeek();
    const updatedPlayer = payWeeklySalary({ ...player, suspendedMatches: Math.max(0, player.suspendedMatches-1), energy: Math.min(100, player.energy+10) });
    const nextSeasonProgress = { ...seasonProgress, matchesPlayed:seasonProgress.matchesPlayed+auto.matchesPlayedDelta };
    if(auto.matchesPlayedDelta>0 && nextSeasonProgress.matchesPlayed>=nextSeasonProgress.matchesTotal){
      const { newCareer, screen, transferOffers } = finishSeason({ ...career, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }, updatedPlayer, nextSeasonProgress);
      setTransferOffers(transferOffers); setCareer(newCareer); setScreen(screen);
      return;
    }
    persist(c=>({ ...c, player:updatedPlayer, weekIndex:c.weekIndex+1, seasonProgress:nextSeasonProgress, calendar:auto.calendar, cup:auto.cup, continentalCup:auto.continentalCup, worldCup:auto.worldCup }));
  }

  function handleExport(){ exportCareer(career); }

  function requestTransfer(){
    setRequestingTransfer(true);
    // Como foi o próprio jogador que pediu, ignora a "chance" aleatória normal — só olha se é elegível.
    const eligible = player.overall >= player.club.reputation - 25 && (player.reputation.national > 15 || player.overall >= 68);
    if(!eligible){
      setRequestedOffers([]);
      return;
    }
    const candidates = CLUBS.filter(c=>c.id!==player.club.id && Math.abs(c.reputation - Math.max(player.club.reputation, player.overall)) < 38);
    const count = rand(2,4);
    const chosen = [...candidates].sort(()=>Math.random()-0.5).slice(0,count);
    const offers = chosen.map(c=>{
      const foreign = c.countryId!==player.club.countryId;
      const loanLean = foreign && c.reputation > player.overall+15 ? 0.55 : 0.25;
      const isLoan = Math.random() < loanLean;
      return {
        id:`req-${c.id}-${Date.now()}-${Math.random()}`, club:c, type: isLoan?"emprestimo":"compra",
        salaryPerWeek: Math.round((player.overall*120 + c.reputation*40) * (c.tier==="grande"?1.6:c.tier==="medio"?1.1:0.8) * (isLoan?0.75:1)),
        durationSeasons: isLoan ? 1 : rand(2,4),
        squadRole: c.squadQuality > player.overall+8 ? "Peça de rotação" : c.squadQuality < player.overall-5 ? "Titular imediato" : "Disputa de posição",
        startingChance: Math.max(15, Math.min(95, 100 - (c.squadQuality - player.overall))),
      };
    });
    setRequestedOffers(offers);
  }

  function acceptMidSeasonTransfer(offer){
    const newClub = offer.club;
    const newCoach = generateCoach(newClub);
    const newSquad = generateSquad(newClub);
    const newCalendar = buildCalendar(newClub, career.quickMode);
    // Fecha o pedaço da temporada no clube antigo como um registro parcial, antes de trocar.
    const partialRecord = { season:career.currentSeason, clubId:player.club.id, matches:seasonProgress.matchesPlayed, goals:seasonProgress.goals,
      assists:seasonProgress.assists, averageRating: seasonProgress.matchesPlayed>0 ? Math.round((seasonProgress.ratingSum/seasonProgress.matchesPlayed)*10)/10 : 0,
      yellowCards:seasonProgress.yellowCards, redCards:seasonProgress.redCards, injuries:seasonProgress.injuriesThisSeason, titles:[],
      overallStart:seasonProgress.overallAtStart, overallEnd:player.overall, marketValue:Math.round(player.overall*40000) };
    const updatedHistory = player.clubHistory.map((h,i)=> i===player.clubHistory.length-1 ? {...h, toSeason:career.currentSeason} : h);
    updatedHistory.push({ clubId:newClub.id, clubName:newClub.name, fromSeason:career.currentSeason });
    const news = newsFromTransfer(player, player.club, newClub, career.currentSeason);
    let updatedPlayer = { ...player, club:newClub, clubHistory:updatedHistory, squad:newSquad, coachTrust:50, weeklySalary:offer.salaryPerWeek,
      reputation:{...player.reputation, club:35}, seasons:[...player.seasons, partialRecord], newsLog:[news, ...player.newsLog].slice(0,40) };
    updatedPlayer = addMilestone(updatedPlayer, `Pediu transferência e se acertou com o ${newClub.name} no meio da temporada.`, career.currentSeason, "transferência");
    const builtCups = buildSeasonCups(newClub);
    const totalLeagueWeeks = newCalendar.rounds.length*2;
    const newCup = scheduleCupWeeks(builtCups.cup, totalLeagueWeeks, 0);
    const newContinentalCup = builtCups.continentalCup ? scheduleContinentalWeeks(builtCups.continentalCup, totalLeagueWeeks, 4) : null;
    // Continua a temporada de onde estava — não reinicia semana/rodada, só troca o calendário
    // (adversários) pro novo clube. Se a nova liga tiver menos rodadas que a semana atual, trava no limite.
    const maxWeekIndex = Math.max(0, (newCalendar.rounds.length*2)-2);
    const continuedWeekIndex = Math.min(career.weekIndex, maxWeekIndex);
    persist(c=>({ ...c, player:updatedPlayer, currentCoach:newCoach, calendar:newCalendar, cup:newCup, continentalCup:newContinentalCup, weekIndex:continuedWeekIndex,
      seasonProgress:{ ...seasonProgress, matchesTotal:newCalendar.matchesTotal, matchesPlayed: Math.min(seasonProgress.matchesPlayed, Math.max(0, newCalendar.matchesTotal-1)) } }));
    setRequestedOffers(null);
    setRequestingTransfer(false);
  }

  const attrs = player.attributes;
  const attrEntries = attrTab==="Físicos" ? Object.entries(attrs.physical) : attrTab==="Técnicos" ? Object.entries(attrs.technical) : Object.entries(attrs.mental);
  const clubPrimary = player.club.primaryColor, clubSecondary = player.club.secondaryColor;

  return (
    <div className="min-h-screen bg-pitch-950 pb-16">
      <div className="h-1" style={{background:`linear-gradient(90deg, ${clubPrimary}, ${clubSecondary}, ${clubPrimary})`}} />
      <header className="border-b border-pitch-600 bg-pitch-900/90 backdrop-blur sticky top-0 z-10 relative overflow-hidden">
        <div className="absolute inset-0 opacity-[0.07] pointer-events-none" style={{background:`radial-gradient(600px 120px at 10% 0%, ${clubPrimary}, transparent)`}} />
        <div className="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center gap-6 relative">
          <div className="flex items-center gap-3">
            <div className="rounded-lg overflow-hidden border-2 shrink-0" style={{borderColor:clubPrimary, boxShadow:`0 0 0 3px ${clubPrimary}22`}}>
              <PlayerAvatar appearance={player.appearance} club={player.club} number={player.preferredNumber} position={player.position} size={44} />
            </div>
            <div>
              <h1 className="font-display font-bold text-lg text-steel-100 leading-tight">{player.firstName} {player.lastName}{player.nickname && <span className="text-steel-400 font-normal"> "{player.nickname}"</span>}</h1>
              <p className="text-xs text-steel-400 flex items-center gap-1.5">
                <span className="inline-block w-2 h-2 rounded-full shrink-0" style={{backgroundColor:clubPrimary}} />
                {player.club.name} · {POSITION_LABELS[player.position]} · {player.age} anos
              </p>
            </div>
          </div>
          <div className="flex items-center gap-6 ml-auto">
            <OverallCircle value={player.overall} size={64} label="OVR" />
            <MiniStat label="Moral" value={player.morale} />
            <MiniStat label="Energia" value={player.energy} />
            <MiniStat label="Confiança" value={player.coachTrust} />
            <button className="btn-secondary !px-4 !py-2 text-xs" onClick={()=>{ setRequestedOffers(null); requestTransfer(); }}>Pedir transferência</button>
            <button className="btn-secondary !px-4 !py-2 text-xs" onClick={handleExport}>Exportar carreira</button>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 pt-6 grid lg:grid-cols-[1fr_340px] gap-6">
        <div className="space-y-6">
          {requestedOffers && (
            <div className="card p-5 border-l-2 border-touchline/60">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-display font-semibold text-steel-100">Mercado — clubes interessados</h3>
                <button className="text-xs text-steel-400 hover:underline" onClick={()=>setRequestedOffers(null)}>Fechar</button>
              </div>
              {requestedOffers.length===0 ? (
                <p className="text-sm text-steel-400">Nenhum clube demonstrou interesse por enquanto. Melhore sua reputação e tente de novo mais adiante.</p>
              ) : (
                <div className="grid sm:grid-cols-2 gap-3">
                  {requestedOffers.map(o=> <TransferOfferCard key={o.id} offer={o} onAccept={acceptMidSeasonTransfer} onReject={()=>setRequestedOffers(prev=>prev.filter(x=>x.id!==o.id))} />)}
                </div>
              )}
            </div>
          )}
          <div className="card p-4">
            <div className="flex items-center justify-between">
              <div>
                <span className="eyebrow">Temporada {career.currentSeason} · {calendar.league}</span>
                <p className="text-sm text-steel-300 mt-0.5">{seasonProgress.matchesPlayed}/{seasonProgress.matchesTotal} partidas disputadas</p>
                {calendar.reduced && <p className="text-[11px] text-state-warn mt-1">Liga em modo reduzido — poucos clubes cadastrados nesta divisão.</p>}
              </div>
              <div className="flex items-center gap-3">
                <div className="w-32 h-2 rounded-full bg-pitch-700 overflow-hidden">
                  <div className="h-full bg-touchline rounded-full" style={{width:`${(seasonProgress.matchesPlayed/seasonProgress.matchesTotal)*100}%`, transition:"width .3s"}} />
                </div>
                <button className="text-xs text-touchline hover:underline" onClick={()=>setShowStandings(v=>!v)}>{showStandings?"Ocultar tabela":"Ver tabela"}</button>
              </div>
            </div>
            <div className="flex items-center gap-6 mt-4 pt-4 border-t border-pitch-700">
              <div>
                <p className="eyebrow text-[10px] mb-1">Nesta temporada</p>
                <p className="text-sm text-steel-200">
                  {player.position==="GOL" ? (
                    <><span className="stat-num text-steel-100">{seasonProgress.saves||0}</span> defesas · <span className="stat-num text-steel-100">{seasonProgress.cleanSheets||0}</span> jogos sem sofrer gol</>
                  ) : (
                    <><span className="stat-num text-steel-100">{seasonProgress.goals}</span> gols · <span className="stat-num text-steel-100">{seasonProgress.assists}</span> assistências</>
                  )}
                </p>
              </div>
              <div>
                <p className="eyebrow text-[10px] mb-1">Carreira</p>
                <p className="text-sm text-steel-200">
                  {player.position==="GOL" && <><span className="stat-num text-steel-100">{player.totalSaves||0}</span> defesas · <span className="stat-num text-steel-100">{player.totalCleanSheets||0}</span> sem sofrer gol · </>}
                  <span className="stat-num text-steel-100">{Math.max(player.totalCareerGoals||0, careerGoals+seasonProgress.goals)}</span> gols · <span className="stat-num text-steel-100">{Math.max(player.totalCareerAssists||0, careerAssists+seasonProgress.assists)}</span> assistências · <span className="stat-num text-steel-100">{Math.max(player.totalCareerMatches||0, careerMatches+seasonProgress.matchesPlayed)}</span> jogos</p>
              </div>
            </div>
          </div>

          {showStandings && <div className="card p-4"><h3 className="font-display font-semibold text-steel-100 mb-3">Classificação — {calendar.league}</h3><StandingsTable calendar={calendar} playerClubId={player.club.id} /></div>}

          {coachChat && <CoachChatCard opener={coachChat} onRespond={respondCoachChat} />}
          {relationshipEvent && <RelationshipEventCard event={relationshipEvent} onRespond={respondRelationshipEvent} />}

          {activeInjury ? (
            <div className="card p-6 border-l-2 border-state-down/60">
              <span className="eyebrow text-state-down">Lesionado</span>
              <h2 className="font-display text-xl font-semibold text-steel-100 mt-1 mb-2">{activeInjury.name}</h2>
              <p className="text-sm text-steel-400 mb-1">Gravidade: {activeInjury.severity}</p>
              <p className="text-sm text-steel-400 mb-4">Semanas restantes de recuperação: {activeInjury.weeksRemaining}</p>
              <button className="btn-primary" onClick={advanceInjuryWeek}>Avançar semana de recuperação</button>
            </div>
          ) : isSuspended ? (
            <div className="card p-6 border-l-2 border-state-warn/60">
              <span className="eyebrow text-state-warn">Suspenso</span>
              <h2 className="font-display text-xl font-semibold text-steel-100 mt-1 mb-2">Você não pode entrar em campo</h2>
              <p className="text-sm text-steel-400 mb-4">Partidas de suspensão restantes: {player.suspendedMatches}</p>
              <button className="btn-primary" onClick={playThroughSuspension}>Assistir do banco / avançar semana</button>
            </div>
          ) : isByeWeek ? (
            <div className="card p-6 text-center">
              <span className="eyebrow">Rodada livre</span>
              <h2 className="font-display text-xl font-semibold text-steel-100 mt-2 mb-4">Seu time folga nesta rodada do {calendar.league}.</h2>
              <button className="btn-primary" onClick={skipByeWeek}>Avançar semana</button>
            </div>
          ) : worldCupTie ? (
            <div className="card p-6 relative overflow-hidden border-2" style={{borderColor:"#B8892E"}}>
              <div className="absolute inset-0 opacity-[0.12] pointer-events-none" style={{background:"linear-gradient(135deg, #B8892E, #155FD1, #0F9D51)"}} />
              <div className="relative text-center">
                <span className="eyebrow" style={{color:"#B8892E"}}>🏆 Copa do Mundo {career.worldCup.name.replace("Copa do Mundo ","")} · {continentalRoundLabel(career.worldCup)}</span>
                <div className="flex items-center justify-center gap-4 my-4">
                  <div className="flex flex-col items-center gap-1.5 w-28">
                    <div className="w-16 h-16 rounded-full flex items-center justify-center font-display font-bold shadow-lg" style={{backgroundColor:worldCupTie.home.primaryColor, color:worldCupTie.home.secondaryColor}}>
                      {worldCupTie.home.name.replace("Seleção ","").split(" ").map(w=>w[0]).slice(0,2).join("")}
                    </div>
                    <p className="text-xs text-steel-300 leading-tight">{worldCupTie.home.name}</p>
                  </div>
                  <span className="font-display text-2xl" style={{color:"#B8892E"}}>×</span>
                  <div className="flex flex-col items-center gap-1.5 w-28">
                    <div className="w-16 h-16 rounded-full flex items-center justify-center font-display font-bold shadow-lg" style={{backgroundColor:worldCupTie.away.primaryColor, color:worldCupTie.away.secondaryColor}}>
                      {worldCupTie.away.name.replace("Seleção ","").split(" ").map(w=>w[0]).slice(0,2).join("")}
                    </div>
                    <p className="text-xs text-steel-300 leading-tight">{worldCupTie.away.name}</p>
                  </div>
                </div>
                <p className="text-sm text-steel-400 mb-5">O país inteiro para para assistir esse jogo. A pressão é máxima.</p>
                <button className="btn-primary" onClick={goToWorldCupMatch} style={{backgroundColor:"#B8892E"}}>Entrar em campo</button>
              </div>
            </div>
          ) : nationalMatchDue ? (
            <div className="card p-6 bg-stadium-glow">
              <span className="eyebrow">Data Fifa · Seleção Nacional</span>
              <h2 className="font-display text-2xl font-semibold text-steel-100 mt-1 mb-1">Amistoso Internacional</h2>
              <p className="text-sm text-steel-400 mb-5">Convocado pela seleção — {career.nationalTeam.matchesRemaining} jogo(s) restante(s) nesta Data Fifa.</p>
              <button className="btn-primary" onClick={goToNationalMatch}>Ir para o jogo</button>
            </div>
          ) : cupTie ? (
            <div className="card p-6 bg-stadium-glow">
              <span className="eyebrow">{activeCup.name} · {cupKey==="cup" ? cupRoundName(activeCup.rounds[activeCup.currentRoundIdx].length*2) : continentalRoundLabel(activeCup)}</span>
              <h2 className="font-display text-2xl font-semibold text-steel-100 mt-1 mb-1">
                {cupTie.home.id===player.club.id ? `${player.club.name} x ${cupTie.away.name}` : `${cupTie.home.name} x ${player.club.name}`}
              </h2>
              <p className="text-sm text-steel-400 mb-5">{cupTie.home.id===player.club.id ? "Jogo em casa" : "Jogo fora de casa"} · {cupKey==="cup"||activeCup.phase==="final" ? "mata-mata, quem perder está fora." : "fase de grupos."}</p>
              <button className="btn-primary" onClick={goToCupMatch}>Ir para o jogo</button>
            </div>
          ) : isMatchWeek && fixture ? (()=>{
            const rivalry = findRivalry(fixture.home.id, fixture.away.id);
            return (
            <div className={`card p-6 relative overflow-hidden ${rivalry?"border-2":""}`} style={rivalry?{borderColor:"#B8892E"}:{}}>
              <div className="absolute inset-0 opacity-[0.10] pointer-events-none" style={{background:`linear-gradient(120deg, ${fixture.home.primaryColor}, ${fixture.away.primaryColor})`}} />
              <div className="relative">
                {rivalry && <p className="text-center font-display font-bold text-xs tracking-widest mb-1" style={{color:"#B8892E"}}>🔥 {rivalry.name.toUpperCase()} 🔥</p>}
                <span className="eyebrow">Próximo compromisso · {calendar.league}</span>
                <div className="flex items-center justify-center gap-4 my-4">
                  <div className="flex flex-col items-center gap-1.5 w-24">
                    <div className="w-14 h-14 rounded-full flex items-center justify-center font-display font-bold text-sm shrink-0 shadow-sm" style={{backgroundColor:fixture.home.primaryColor, color:fixture.home.secondaryColor}}>
                      {fixture.home.name.split(" ").map(w=>w[0]).slice(0,2).join("")}
                    </div>
                    <p className="text-xs text-steel-300 text-center leading-tight">{fixture.home.name}</p>
                  </div>
                  <span className="font-display text-steel-400 text-sm">×</span>
                  <div className="flex flex-col items-center gap-1.5 w-24">
                    <div className="w-14 h-14 rounded-full flex items-center justify-center font-display font-bold text-sm shrink-0 shadow-sm" style={{backgroundColor:fixture.away.primaryColor, color:fixture.away.secondaryColor}}>
                      {fixture.away.name.split(" ").map(w=>w[0]).slice(0,2).join("")}
                    </div>
                    <p className="text-xs text-steel-300 text-center leading-tight">{fixture.away.name}</p>
                  </div>
                </div>
                <p className="text-sm text-steel-400 mb-1 text-center">{fixture.home.id===player.club.id ? "Jogo em casa" : "Jogo fora de casa"}. Sua energia atual é {Math.round(player.energy)}/100.</p>
                <div className="text-center mt-4">
                  {matchRole==="titular" && <>
                    <p className="text-xs text-state-up mb-4">Você é titular nesta partida.</p>
                    <button className="btn-primary" onClick={goToMatch}>Ir para o jogo</button>
                  </>}
                  {matchRole==="banco" && <>
                    <p className="text-xs text-state-warn mb-4">O treinador escalou você no banco. Você deve entrar no segundo tempo, com menos chances de decidir a partida.</p>
                    <button className="btn-primary" onClick={goToMatch}>Acompanhar do banco</button>
                  </>}
                  {matchRole==="fora" && <>
                    <p className="text-xs text-state-down mb-4">Você não foi relacionado para esta partida — a concorrência na sua posição está forte demais agora.</p>
                    <button className="btn-primary" onClick={skipUnselectedMatch}>Avançar semana</button>
                  </>}
                </div>
              </div>
            </div>
            );
          })() : isTrainingWeek ? (
            <div className="card overflow-hidden">
              <div className="h-24 sm:h-28">
                <TrainingGroundScene weather={["sol","nublado","chuva"][(career.weekIndex+career.currentSeason)%3]} clubPrimary={clubPrimary} />
              </div>
              <div className="p-6">
              <span className="eyebrow">Semana livre · Centro de treinamento do {player.club.name}</span>
              <h2 className="font-display text-2xl font-semibold text-steel-100 mt-1 mb-4">Como você vai se preparar?</h2>
              <div className="grid sm:grid-cols-2 gap-3">
                {TRAINING_OPTIONS.filter(opt=> (!opt.hiddenFor || !opt.hiddenFor.includes(player.position)) && (!opt.onlyFor || opt.onlyFor.includes(player.position))).map(opt=>(
                  <button key={opt.id} onClick={()=>handleTraining(opt.id)} className="text-left p-4 rounded-lg border border-pitch-700 bg-pitch-800 hover:border-touchline/60 transition-colors">
                    <p className="font-display font-semibold text-steel-100">{opt.label}</p>
                    <p className="text-xs text-steel-400 mt-1 mb-2">{opt.description}</p>
                    <div className="flex gap-3 text-[11px] text-steel-400">
                      <span>Energia: {opt.energyCost>0?`-${opt.energyCost}`:`+${-opt.energyCost}`}</span>
                      {opt.injuryRisk>0 && <span>Risco: {opt.injuryRisk}%</span>}
                    </div>
                  </button>
                ))}
              </div>
              </div>
            </div>
          ) : <div className="card p-6 text-center text-steel-400">Preparando a próxima etapa da temporada...</div>}

          <div className="card p-5">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display font-semibold text-steel-100">Atributos</h3>
              <div className="flex gap-1">{ATTR_TABS.map(tab=> <button key={tab} onClick={()=>setAttrTab(tab)} className={`px-3 py-1 rounded-full text-xs font-display ${attrTab===tab?"bg-touchline text-white":"text-steel-400 hover:text-steel-200"}`}>{tab}</button>)}</div>
            </div>
            <div>{attrEntries.map(([key,value])=> <AttributeBar key={key} label={ATTR_LABELS[key]||key} value={value} />)}</div>
          </div>
        </div>

        <div className="space-y-6">
          <div className="card p-4 border-l-[3px]" style={{borderLeftColor:"#B8892E"}}>
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display font-semibold text-steel-100">💰 Patrimônio</h3>
              <button className="text-xs text-touchline hover:underline" onClick={()=>setShowShop(v=>!v)}>{showShop?"Fechar loja":"Ver loja"}</button>
            </div>
            <div className="grid grid-cols-2 gap-3 text-xs mb-2">
              <div><p className="eyebrow text-[10px]">Saldo</p><p className="stat-num text-steel-100 text-base">€{Math.round(player.money).toLocaleString("pt-BR")}</p></div>
              <div><p className="eyebrow text-[10px]">Salário/semana</p><p className="stat-num text-steel-100 text-base">€{Math.round(player.weeklySalary||0).toLocaleString("pt-BR")}</p></div>
            </div>
            {player.relationshipStatus && player.relationshipStatus!=="solteiro" && (
              <p className="text-[11px] text-steel-400 mb-1">{player.relationshipStatus==="namorando"?`Namorando ${player.partnerName}`:player.relationshipStatus==="noivo"?`Noivo(a) de ${player.partnerName}`:`Casado(a) com ${player.partnerName}`}{player.children && player.children.length>0 ? ` · ${player.children.length} filho(s)` : ""}</p>
            )}
            {player.possessions && player.possessions.length>0 && (
              <p className="text-[11px] text-steel-400 mb-2">{player.possessions.length} bem(ns) adquirido(s)</p>
            )}
            {showShop && (
              <div className="space-y-2 mt-3 max-h-72 overflow-y-auto pr-1">
                {SHOP_ITEMS.map(item=>{
                  const owned = (player.possessions||[]).some(p=>p.id===item.id);
                  const affordable = player.money>=item.cost;
                  return (
                    <button key={item.id} disabled={!affordable} onClick={()=>buyItem(item)}
                      className={`w-full text-left p-2.5 rounded-lg border flex items-center justify-between gap-2 transition-colors ${affordable?"border-pitch-700 bg-pitch-800 hover:border-touchline/60":"border-pitch-700 bg-pitch-800 opacity-40 cursor-not-allowed"}`}>
                      <span className="flex items-center gap-2 text-xs text-steel-200">
                        <span>{item.icon}</span>{item.name}{owned && <span className="text-state-up">✓</span>}
                      </span>
                      <span className="stat-num text-xs text-steel-100 shrink-0">€{item.cost.toLocaleString("pt-BR")}</span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
          {(career.cup || career.continentalCup) && (
            <div className="card p-4">
              <h3 className="font-display font-semibold text-steel-100 mb-3">Copas</h3>
              <div className="space-y-2 text-xs">
                {career.cup && (
                  <div>
                    <div className="flex items-center justify-between">
                      <button className="text-steel-300 hover:text-touchline text-left" onClick={()=>setCupDetailsOpen(v=>v==="cup"?null:"cup")}>{career.cup.name} {cupDetailsOpen==="cup"?"▲":"▼"}</button>
                      <span className={career.cup.champion?"text-crest-gold font-semibold":career.cup.eliminated?"text-state-down":"text-steel-400"}>
                        {career.cup.champion ? "🏆 Campeão" : career.cup.eliminated ? "Eliminado" : cupRoundName(career.cup.rounds[career.cup.currentRoundIdx].length*2)}
                      </span>
                    </div>
                    {cupDetailsOpen==="cup" && <CupDetailsPanel cup={career.cup} player={player} kind="knockout" />}
                  </div>
                )}
                {career.continentalCup && (
                  <div>
                    <div className="flex items-center justify-between">
                      <button className="text-steel-300 hover:text-touchline text-left" onClick={()=>setCupDetailsOpen(v=>v==="continentalCup"?null:"continentalCup")}>{career.continentalCup.name} {cupDetailsOpen==="continentalCup"?"▲":"▼"}</button>
                      <span className={career.continentalCup.champion?"text-crest-gold font-semibold":career.continentalCup.eliminated?"text-state-down":"text-steel-400"}>
                        {career.continentalCup.champion ? "🏆 Campeão" : career.continentalCup.eliminated ? "Fora da competição" : continentalRoundLabel(career.continentalCup)}
                      </span>
                    </div>
                    {cupDetailsOpen==="continentalCup" && <CupDetailsPanel cup={career.continentalCup} player={player} kind="continental" />}
                  </div>
                )}

                  <span className={career.worldCup.champion?"font-semibold":career.worldCup.eliminated?"text-state-down":"text-steel-400"} style={career.worldCup.champion?{color:"#B8892E"}:{}}>
                    {career.worldCup.champion ? "🏆 Campeão do Mundo!" : career.worldCup.eliminated ? "Fora da competição" : continentalRoundLabel(career.worldCup)}

          <div className="card p-4 border-l-[3px]" style={{borderLeftColor:clubPrimary}}>

              <h3 className="font-display font-semibold text-steel-100">👥 Elenco — {player.club.name}</h3>

            </div>

              {(showFullSquad ? player.squad : player.squad.slice(0,8)).map(tm=>(
                <div key={tm.id} className="flex items-center justify-between text-xs">
                  <span className="text-steel-200">{tm.name}</span>
                  <span className="text-steel-400">{POSITION_LABELS[tm.position]} · {tm.overall}{showFullSquad?` · ${tm.status}`:""}</span>
                </div>
              ))}
            </div>
          </div>
          {player.milestones && player.milestones.length>0 && (
            <div className="card p-4 border-l-[3px]" style={{borderLeftColor:clubPrimary}}>
              <h3 className="font-display font-semibold text-steel-100 mb-3">📌 Marcos da carreira</h3>
              <div className="max-h-56 overflow-y-auto pr-1">
                <CareerTimeline milestones={player.milestones.slice(0,6)} />
              </div>
            </div>
          )}
          <div>
            <h3 className="font-display font-semibold text-steel-100 mb-3">📰 Notícias</h3>
            <div className="space-y-3">
              {(showAllNews ? player.newsLog : player.newsLog.slice(0,4)).map(item=> <NewsCard key={item.id} item={item} />)}
              {player.newsLog.length===0 && <p className="text-xs text-steel-400">Nenhuma notícia ainda nesta carreira.</p>}
              {player.newsLog.length>4 && <button className="text-xs text-touchline hover:underline" onClick={()=>setShowAllNews(v=>!v)}>{showAllNews?"Ver menos":"Ver todas"}</button>}
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}

function FormationPitch({ club, isPlayerTeam, playerPosition, squad, flip, compact, ballEvent }){
  const positions = Object.keys(POSITION_COORDS);
  const usedNames = new Set();
  const [ballPos, setBallPos] = useState(null);
  useEffect(()=>{
    if(!ballEvent) return;
    setBallPos({ top:"50%", left:"50%" });
    const t1 = window.setTimeout(()=>{
      const goalTop = flip ? "9%" : "91%";
      const missSide = Math.random()<0.5 ? "14%" : "86%";
      const targetLeft = ballEvent.kind==="goal" ? "50%" : ballEvent.kind==="save" ? "50%" : missSide;
      const targetTop = ballEvent.kind==="save" ? (flip?"22%":"78%") : goalTop;
      setBallPos({ top:targetTop, left:targetLeft });
    }, 40);
    const t2 = window.setTimeout(()=>setBallPos(null), 950);
    return ()=>{ window.clearTimeout(t1); window.clearTimeout(t2); };
    // eslint-disable-next-line
  }, [ballEvent && ballEvent.id]);
  return (
    <div className="relative rounded-lg overflow-hidden shadow-inner" style={{background:"linear-gradient(180deg, #1c7a3f 0%, #146334 100%)", aspectRatio: compact?"1.35":"0.85", transition:"aspect-ratio .35s ease"}}>
      <div className="absolute inset-0" style={{backgroundImage:"repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 15%, rgba(0,0,0,0.02) 15% 30%)"}} />
      <div className="absolute inset-2 border border-white/20 rounded-sm" />
      <div className="absolute left-1/2 top-1/2 w-12 h-12 -ml-6 -mt-6 border border-white/20 rounded-full" />
      <div className="absolute left-1/2 top-1/2 w-0.5 h-0.5 -ml-px -mt-px bg-white/30 rounded-full" />
      <div className={`absolute left-1/2 ${flip?"top-2":"bottom-2"} w-[46%] h-[13%] -ml-[23%] border border-white/20 ${flip?"border-t-0":"border-b-0"}`} />
      <div className={`absolute left-1/2 ${flip?"top-2":"bottom-2"} w-[22%] h-[6%] -ml-[11%] border border-white/20 ${flip?"border-t-0":"border-b-0"}`} />
      {positions.map(pos=>{
        const c = POSITION_COORDS[pos];
        const top = flip ? `${100-parseFloat(c.top)}%` : c.top;
        const isPlayerSlot = isPlayerTeam && pos===playerPosition;
        let label = pos;
        if(isPlayerSlot) label = "★";
        else if(squad){
          const member = squad.find(t=>t.position===pos && !usedNames.has(t.id));
          if(member){ usedNames.add(member.id); label = member.name.split(" ").pop().slice(0,3).toUpperCase(); }
        }
        return (
          <div key={pos} className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-0.5" style={{top, left:c.left}}>
            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[8px] font-display font-bold shadow-sm ${isPlayerSlot?"ring-2 ring-white":""}`}
              style={{backgroundColor:club.primaryColor, color:club.secondaryColor}}>{label}</div>
          </div>
        );
      })}
      {ballPos && (
        <div className="absolute w-2.5 h-2.5 rounded-full bg-white shadow-md z-10" style={{top:ballPos.top, left:ballPos.left, transform:"translate(-50%,-50%)", transition:"top .55s cubic-bezier(.25,.6,.3,1), left .55s cubic-bezier(.25,.6,.3,1)", boxShadow:"0 0 6px rgba(255,255,255,0.7)"}} />
      )}
      <div className="absolute top-1 left-1.5 text-[9px] text-white/70 font-mono">{club.name.split(" ").slice(0,2).join(" ")}</div>
    </div>
  );
}

function MatchPage(){
  const { career, setCareer, setScreen, pendingMatch, setLastMatchResult, setTransferOffers } = useCareer();
  const { player } = career;

  const currentRoundIdx = Math.floor(career.weekIndex/2);

  const [timeline] = useState(()=>{
    const onBench = !!pendingMatch.startsOnBench;
    const decisionCount = onBench ? rand(1,2) : rand(3,5);
    const moments = generateMatchMoments(player.position, decisionCount);
    if(onBench){
      // Entra no segundo tempo: as decisões só acontecem depois da sua entrada em campo.
      moments.forEach(m=>{ m.minute = rand(58,88); });
    }
    const tickCount = rand(4,6);
    const tickMinutes = new Set();
    while(tickMinutes.size<tickCount){ tickMinutes.add(rand(3,89)); }
    const ticks = [...tickMinutes].map(m=>({ minute:m, type:"tick", isOpponentChance: Math.random()<0.52 }));
    const decisionBeats = moments.map(m=>({ minute:m.minute, type:"decision", moment:m }));
    const subBeat = onBench ? [{ minute:55, type:"substitution" }] : [];
    const combined = [...decisionBeats, ...ticks, ...subBeat, { minute:45, type:"halftime" }].sort((a,b)=>a.minute-b.minute);
    return combined;
  });
  const [beatIndex, setBeatIndex] = useState(-1); // -1 = intro, ainda não começou
  const [subPhase, setSubPhase] = useState("intro"); // intro | auto | choose | rolling | resolved | halftime | fulltime | press
  const [outcomes, setOutcomes] = useState([]);
  const [currentOutcome, setCurrentOutcome] = useState(null);
  const [currentTick, setCurrentTick] = useState(null);
  const [log, setLog] = useState([]);
  const [homeGoals, setHomeGoals] = useState(0);
  const [awayGoals, setAwayGoals] = useState(0);
  const [matchStats, setMatchStats] = useState({ possession:50, shotsHome:0, shotsAway:0, cornersHome:0, cornersAway:0, foulsHome:0, foulsAway:0 });
  const [ballAnim, setBallAnim] = useState(null);
  function fireBallAnim(isHomeSide, kind){
    setBallAnim({ id:Date.now()+Math.random(), side: isHomeSide?"home":"away", kind });
  }
  const [goalFlash, setGoalFlash] = useState(null);
  const [crowdLine, setCrowdLine] = useState(null);
  const [otherGames, setOtherGames] = useState(()=> buildLiveOtherGames(career.calendar, currentRoundIdx, player.club.id));
  const [pendingResult, setPendingResult] = useState(null);
  const [pendingSetPiece, setPendingSetPiece] = useState(null);
  const [shootout, setShootout] = useState(null);
  const [shootoutKickPhase, setShootoutKickPhase] = useState("ready"); // ready | rolling | revealed
  const [lastKickText, setLastKickText] = useState(null);
  const [pressAnswered, setPressAnswered] = useState(false);
  const [showTopScorers, setShowTopScorers] = useState(false);
  const [reactionEffects, setReactionEffects] = useState([]);
  const [teammateGoalEvents, setTeammateGoalEvents] = useState([]);

  const opponentQuality = useMemo(()=>{
    const c = pendingMatch.opponentClub;
    return Math.min(97, Math.max(25, c.squadQuality*0.7 + c.reputation*0.3 + (Math.random()*14-7)));
  }, [pendingMatch.opponentClub.id]);
  const teamQuality = player.club.squadQuality;

  const pressScenario = useMemo(()=>{
    if(!pendingResult) return null;
    const careerMatchesBefore = player.seasons.reduce((s,x)=>s+x.matches,0) + career.seasonProgress.matchesPlayed;
    return pickPressScenario(pendingResult, careerMatchesBefore);
  }, [pendingResult]);

  if(!career || !pendingMatch) return null;

  const playerTeamDisplay = pendingMatch.playerTeamClub || player.club;
  const homeClub = pendingMatch.isHome ? playerTeamDisplay : pendingMatch.opponentClub;
  const awayClub = pendingMatch.isHome ? pendingMatch.opponentClub : playerTeamDisplay;

  function pushLog(minute, text){
    setLog(prev=>[{ minute, text }, ...prev].slice(0,30));
  }

  function registerGoal(scoredByPlayerTeam, minute){
    if(pendingMatch.isHome){
      if(scoredByPlayerTeam) setHomeGoals(g=>g+1); else setAwayGoals(g=>g+1);
    } else {
      if(scoredByPlayerTeam) setAwayGoals(g=>g+1); else setHomeGoals(g=>g+1);
    }
    const scoringClub = scoredByPlayerTeam ? player.club : pendingMatch.opponentClub;
    const isFinal = /(^|—\s)Final$/i.test((pendingMatch.competition||"").trim());
    const isLate = (minute||0)>=85;
    const intense = isFinal || isLate;
    setGoalFlash({ name: scoringClub.name, color: scoringClub.primaryColor, textColor: scoringClub.secondaryColor, intense,
      tag: isFinal ? "GOL DA FINAL!" : isLate ? "GOL NOS MINUTOS FINAIS!" : null });
    window.setTimeout(()=>setGoalFlash(null), intense?2800:1800);
  }

  function startMatch(){
    setBeatIndex(0);
    playBeat(0);
  }

  function playBeat(idx){
    const beat = timeline[idx];
    if(!beat){ setSubPhase("fulltime"); return; }
    setOtherGames(prev=>tickOtherGames(prev, beat.minute));
    if(beat.type==="halftime"){
      setSubPhase("halftime");
      pushLog(45, "Fim de primeiro tempo.");
      return;
    }
    if(beat.type==="substitution"){
      pushLog(beat.minute, `Você entra em campo! O treinador faz a substituição aos ${beat.minute}'.`);
      setSubPhase("substitution");
      return;
    }
    if(beat.type==="tick"){
      const resolved = resolveAutoTick(beat, opponentQuality, teamQuality, player.squad, pendingMatch.opponentClub);
      const isGoal = resolved.kind==="opponentGoal" || resolved.kind==="teamGoal";
      if(isGoal && Math.random()<0.65){
        resolved.reaction = resolved.kind==="teamGoal" ? GOAL_REACTIONS_TEAM : GOAL_REACTIONS_CONCEDED;
      }
      setCurrentTick(resolved);
      if(isGoal) registerGoal(resolved.kind==="teamGoal", beat.minute);
      if(resolved.kind==="teamGoal" && resolved.scorerId){ setTeammateGoalEvents(prev=>[...prev, resolved.scorerId]); }
      pushLog(beat.minute, resolved.text);
      const tickIsTeamEvent = resolved.kind==="teamGoal" || resolved.kind==="teamMiss";
      const tickIsHomeSide = tickIsTeamEvent ? pendingMatch.isHome : !pendingMatch.isHome;
      fireBallAnim(tickIsHomeSide, isGoal ? "goal" : (Math.random()<0.5?"save":"miss"));
      setMatchStats(prev=>{
        const teamSide = pendingMatch.isHome ? "Home" : "Away";
        const oppSide = pendingMatch.isHome ? "Away" : "Home";
        const isTeamEvent = resolved.kind==="teamGoal" || resolved.kind==="teamMiss";
        const side = isTeamEvent ? teamSide : oppSide;
        const next = { ...prev };
        if(Math.random()<0.7) next[`shots${side}`] = (next[`shots${side}`]||0)+1;
        else next[`corners${side}`] = (next[`corners${side}`]||0)+1;
        if(Math.random()<0.15) next[`fouls${isTeamEvent?oppSide:teamSide}`] = (next[`fouls${isTeamEvent?oppSide:teamSide}`]||0)+1;
        const shift = isTeamEvent ? rand(1,3) : -rand(1,3);
        next.possession = Math.max(32, Math.min(68, prev.possession+shift));
        return next;
      });
      const tense = Math.abs(homeGoals-awayGoals)<=1 && beat.minute>=75;
      if(isGoal || Math.random()<0.35){
        setCrowdLine(crowdReaction(resolved.kind!=="opponentGoal", tense));
      } else setCrowdLine(null);
      setSubPhase("auto");
      return;
    }
    if(beat.type==="decision"){
      setCurrentOutcome(null);
      setCrowdLine(null);
      if(beat.moment._template.isPenalty){
        setPendingSetPiece({ kind:"penalty" });
        setSubPhase("corner-choice");
      } else {
        setSubPhase("choose");
      }
      return;
    }
  }

  function continueFromAuto(){
    const next = beatIndex+1;
    setBeatIndex(next);
    playBeat(next);
  }
  function reactToGoal(reaction){
    setReactionEffects(prev=>[...prev, reaction]);
    continueFromAuto();
  }
  function continueFromHalftime(){
    const next = beatIndex+1;
    setBeatIndex(next);
    playBeat(next);
  }
  function continueFromSubstitution(){
    const next = beatIndex+1;
    setBeatIndex(next);
    playBeat(next);
  }

  function choose(choiceId){
    const beat = timeline[beatIndex];
    const template = beat.moment._template;
    if(template.freeKickChoiceId && choiceId===template.freeKickChoiceId){
      setPendingSetPiece({ kind:"freeKick" });
      setSubPhase("corner-choice");
      return;
    }
    setSubPhase("rolling");
    window.setTimeout(()=>{
      const outcome = resolveChoice(player, beat.moment, choiceId, opponentQuality);
      setCurrentOutcome(outcome);
      setOutcomes(prev=>[...prev, outcome]);
      if(outcome.goal || outcome.assist) registerGoal(true, beat.minute); // assistência também é gol do seu time
      if(outcome.assist && outcome.receiverId){ setTeammateGoalEvents(prev=>[...prev, outcome.receiverId]); }
      if(outcome.goal || outcome.save || outcome.defense || (beat.moment._template.canScore && Math.random()<0.7)){
        fireBallAnim(pendingMatch.isHome, outcome.goal ? "goal" : (Math.random()<0.5?"save":"miss"));
      }
      setMatchStats(prev=>{
        const side = pendingMatch.isHome ? "Home" : "Away";
        const next = { ...prev };
        if(outcome.goal || outcome.assist || Math.random()<0.6) next[`shots${side}`] = (next[`shots${side}`]||0)+1;
        if(outcome.card) next[`fouls${pendingMatch.isHome?"Away":"Home"}`] = (next[`fouls${pendingMatch.isHome?"Away":"Home"}`]||0)+1;
        next.possession = Math.max(32, Math.min(68, prev.possession + (outcome.success?2:-1)));
        return next;
      });
      pushLog(beat.minute, outcome.text);
      const tense = Math.abs(homeGoals-awayGoals)<=1 && beat.minute>=75;
      setCrowdLine(crowdReaction(outcome.success, tense));
      setSubPhase("resolved");
    }, 900);
  }

  function continueFromDecision(){
    const next = beatIndex+1;
    setBeatIndex(next);
    playBeat(next);
  }

  function chooseCorner(corner){
    const beat = timeline[beatIndex];
    setSubPhase("rolling");
    window.setTimeout(()=>{
      const outcome = resolveSetPiece(player, pendingSetPiece.kind, corner, opponentQuality);
      setCurrentOutcome(outcome);
      setOutcomes(prev=>[...prev, outcome]);
      if(outcome.goal) registerGoal(true, beat.minute);
      pushLog(beat.minute, outcome.text);
      fireBallAnim(pendingMatch.isHome, outcome.goal ? "goal" : (Math.random()<0.5?"save":"miss"));
      setCrowdLine(crowdReaction(outcome.success, true));
      setSubPhase("resolved");
    }, 900);
  }

  function afterShootoutKick(homeKicks, awayKicks){
    if(homeKicks.length===awayKicks.length && homeKicks.length>=5){
      const hs = homeKicks.filter(Boolean).length;
      const as = awayKicks.filter(Boolean).length;
      if(hs!==as) return { done:true, winnerSide: hs>as?"home":"away" };
    }
    return { done:false, winnerSide:null };
  }
  function applyShootoutResult(scored, text){
    setLastKickText(text);
    setShootoutKickPhase("rolling");
    window.setTimeout(()=>{
      setShootout(prev=>{
        const isHomeTurn = prev.turn==="home";
        const homeKicks = isHomeTurn ? [...prev.homeKicks, scored] : prev.homeKicks;
        const awayKicks = !isHomeTurn ? [...prev.awayKicks, scored] : prev.awayKicks;
        const { done, winnerSide } = afterShootoutKick(homeKicks, awayKicks);
        const nextTurn = homeKicks.length===awayKicks.length ? "home" : "away";
        return { homeKicks, awayKicks, turn: done?prev.turn:nextTurn, done, winnerSide, lastScored:scored, lastSide:prev.turn };
      });
      setShootoutKickPhase("revealed");
    }, 900);
  }
  function continueShootoutKick(){
    setShootoutKickPhase("ready");
    setLastKickText(null);
  }
  function startShootout(){
    setShootout({ homeKicks:[], awayKicks:[], turn:"home", done:false, winnerSide:null, lastScored:null, lastSide:null });
    setShootoutKickPhase("ready");
    setSubPhase("penalties");
  }
  function takePlayerShootoutKick(corner){
    const outcome = resolveSetPiece(player, "penalty", corner, opponentQuality);
    applyShootoutResult(outcome.goal, outcome.text);
  }
  function takeOpponentShootoutKick(){
    const scored = Math.random() < Math.min(0.82, 0.55 + opponentQuality/400);
    const texts = scored
      ? ["GOL! Cobrança perfeita, sem chances para o goleiro.", "GOL! Frieza total na cobrança."]
      : ["Perdeu! A bola vai por cima do gol.", "Defendeu! Seu goleiro faz uma defesa espetacular!", "Perdeu! A bola bate na trave e sai."];
    applyShootoutResult(scored, pick(texts));
  }

  function goToPress(){
    const result = buildMatchResult(player, pendingMatch.opponentClub, pendingMatch.competition, pendingMatch.isHome, timeline.filter(b=>b.type==="decision").map(b=>b.moment), outcomes, homeGoals, awayGoals);
    const careerMatchesBefore = player.seasons.reduce((s,x)=>s+x.matches,0) + career.seasonProgress.matchesPlayed;
    const { key } = pickPressScenario(result, careerMatchesBefore);
    setPendingResult(result);
    // Nem toda partida rende coletiva — só jogos com algo relevante para contar, ou 30% das partidas comuns.
    if(key!=="generic" || Math.random()<0.3){
      setSubPhase("press");
    } else {
      finalizeAfterPress(null, result);
    }
  }

  function finalizeAfterPress(answer, resultOverride){
    const result = resultOverride || pendingResult;
    let updatedPlayer = JSON.parse(JSON.stringify(player));
    updatedPlayer = payWeeklySalary(updatedPlayer);
    // Contador unificado — soma gols/assistências de QUALQUER competição (liga ou copa),
    // pra "carreira" nunca deixar de contar um gol só porque foi fora do campeonato principal.
    updatedPlayer.totalCareerGoals = (updatedPlayer.totalCareerGoals||0) + result.playerGoals;
    updatedPlayer.totalCareerAssists = (updatedPlayer.totalCareerAssists||0) + result.playerAssists;
    updatedPlayer.totalCareerMatches = (updatedPlayer.totalCareerMatches||0) + 1;
    if(player.position==="GOL"){
      updatedPlayer.totalSaves = (updatedPlayer.totalSaves||0) + (result.saves||0);
      updatedPlayer.totalCleanSheets = (updatedPlayer.totalCleanSheets||0) + (result.cleanSheet?1:0);
    }
    updatedPlayer.energy = Math.round(Math.max(5, updatedPlayer.energy-15));
    updatedPlayer.morale = Math.round(Math.min(100, Math.max(0, updatedPlayer.morale + (result.rating-6)*4)));
    updatedPlayer.coachTrust = Math.round(Math.min(100, Math.max(0, updatedPlayer.coachTrust + (result.rating-6)*3)));
    updatedPlayer.reputation.club = Math.min(100, Math.max(0, updatedPlayer.reputation.club + (result.rating-6)*2));
    updatedPlayer.reputation.fans = Math.min(100, Math.max(0, updatedPlayer.reputation.fans + result.playerGoals*5));
    updatedPlayer.reputation.national = Math.min(100, Math.max(0, updatedPlayer.reputation.national + (result.playerGoals>=2?4:result.rating>=8?2:0)));

    // Evolução pela atuação da partida — usa os atributos que de fato entraram em jogo nas suas decisões.
    const usedInMatch = outcomes.flatMap(o=>o.usesAttributes||[]);
    updatedPlayer = applyMatchAttributeProgress(updatedPlayer, result.rating, usedInMatch);

    // Aplica o efeito acumulado das reações escolhidas durante os lances automáticos da partida.
    if(reactionEffects.length>0){
      const sums = reactionEffects.reduce((acc,r)=>({
        morale:acc.morale+(r.morale||0), coachTrust:acc.coachTrust+(r.coachTrust||0), teammates:acc.teammates+(r.teammates||0),
      }), { morale:0, coachTrust:0, teammates:0 });
      updatedPlayer.morale = Math.round(Math.min(100, Math.max(0, updatedPlayer.morale + sums.morale)));
      updatedPlayer.coachTrust = Math.round(Math.min(100, Math.max(0, updatedPlayer.coachTrust + sums.coachTrust)));
      updatedPlayer.relationships.teammates = Math.min(100, Math.max(0, updatedPlayer.relationships.teammates + sums.teammates));
    }

    // Credita os gols de companheiros marcados durante a partida na estatística do elenco de verdade.
    if(teammateGoalEvents.length>0){
      const counts = {};
      teammateGoalEvents.forEach(id=>{ counts[id] = (counts[id]||0)+1; });
      updatedPlayer.squad = updatedPlayer.squad.map(tm=> counts[tm.id] ? { ...tm, goals:(tm.goals||0)+counts[tm.id] } : tm);
    }

    if(answer){
      updatedPlayer = applyPressAnswer(updatedPlayer, answer, career.currentSeason);
    }

    let suspendedMatches = updatedPlayer.suspendedMatches || 0;
    let seasonYellow = career.seasonProgress.yellowCards + (result.yellowCard?1:0);
    if(result.redCard) suspendedMatches += 1;
    if(result.yellowCard && seasonYellow>0 && seasonYellow % 3 === 0) suspendedMatches += 1;
    updatedPlayer.suspendedMatches = suspendedMatches;

    if(result.injured){
      const severity = Math.random()<0.6?"leve":Math.random()<0.85?"moderada":"grave";
      const weeksOut = severity==="leve"?2:severity==="moderada"?5:10;
      const injury = { id:`injury-${Date.now()}`, name:"Lesão em campo", severity, weeksOut, weeksRemaining:weeksOut, relapseRisk:20, affectedAttributes:["pace","stamina"], occurredSeason:career.currentSeason };
      updatedPlayer.injuries = [...updatedPlayer.injuries, injury];
    }

    const news = newsFromMatch(updatedPlayer, result, career.currentSeason);
    updatedPlayer.newsLog = [news, ...updatedPlayer.newsLog].slice(0,40);

    // Mundo vivo: notícias de outros clubes também acontecem em semanas de jogo.
    if(Math.random()<0.3){
      const worldNews = newsFromWorld(career.calendar, player.club.id, career.currentSeason);
      if(worldNews) updatedPlayer.newsLog = [worldNews, ...updatedPlayer.newsLog].slice(0,40);
    }

    if(answer && answer.counter){
      const scenarioNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"programa",
        headline: `${player.firstName} repercute após declaração na coletiva`,
        summary: `Trecho da entrevista: ${answer.label}`, date:`Temporada ${career.currentSeason}`, impact: answer.press>=0?4:-4, season:career.currentSeason };
      updatedPlayer.newsLog = [scenarioNews, ...updatedPlayer.newsLog].slice(0,40);
    }

    const careerMatchesBefore = player.seasons.reduce((s,x)=>s+x.matches,0) + career.seasonProgress.matchesPlayed;
    const careerGoalsBefore = player.seasons.reduce((s,x)=>s+x.goals,0) + career.seasonProgress.goals;
    if(careerMatchesBefore===0){
      updatedPlayer = addMilestone(updatedPlayer, `Estreia profissional pelo ${player.club.name}, aos ${player.age} anos.`, career.currentSeason, "estreia");
    }
    if(careerGoalsBefore===0 && result.playerGoals>0){
      updatedPlayer = addMilestone(updatedPlayer, `Primeiro gol da carreira, contra o ${result.opponentClub.name}.`, career.currentSeason, "gol");
    }
    if(result.playerGoals>=3){
      updatedPlayer = addMilestone(updatedPlayer, `Hat-trick! ${result.playerGoals} gols em uma só partida contra o ${result.opponentClub.name}.`, career.currentSeason, "gol");
    }
    if(result.redCard){
      updatedPlayer = addMilestone(updatedPlayer, `Expulso em campo contra o ${result.opponentClub.name}.`, career.currentSeason, "disciplina");
    }
    if(result.rating>=9){
      updatedPlayer = addMilestone(updatedPlayer, `Atuação histórica: nota ${result.rating} contra o ${result.opponentClub.name}.`, career.currentSeason, "atuação");
    }

    // Partida de copa: mata-mata à parte, não mexe na tabela nem no contador de jogos da liga.
    if(pendingMatch.isWorldCup){
      const cup = career.worldCup;
      updatedPlayer.caps = (updatedPlayer.caps||0) + 1;
      updatedPlayer.interGoals = (updatedPlayer.interGoals||0) + result.playerGoals;
      let updatedCup, wcNews;
      if(cup.phase==="groups"){
        updatedCup = advanceContinentalCup(cup, false, buildPlayerNationalTeamClub(player), pendingMatch.opponentClub, result.homeGoals, result.awayGoals);

          updatedPlayer = addMilestone(updatedPlayer, `Semifinalista da Copa do Mundo!`, career.currentSeason, "seleção");
        } else if(updatedCup.eliminated){

        const isDraw = result.homeGoals===result.awayGoals;
        const wonNormally = pendingMatch.isHome ? result.homeGoals>result.awayGoals : result.awayGoals>result.homeGoals;
        const wonOnPens = isDraw && shootout && shootout.winnerSide && (shootout.winnerSide==="home")===pendingMatch.isHome;
        const finalPlayerWon = wonNormally || wonOnPens || (isDraw && !shootout && Math.random()<0.5);

        if(finalPlayerWon){

            summary:`Título decidido${isDraw?" nos pênaltis":""} contra a ${pendingMatch.opponentClub.name}. O país inteiro comemora.`, date:`Temporada ${career.currentSeason}`, impact:60, season:career.currentSeason };
          updatedPlayer = addMilestone(updatedPlayer, `CAMPEÃO DO MUNDO!`, career.currentSeason, "título");
          updatedPlayer = { ...updatedPlayer, achievements:[...updatedPlayer.achievements, { id:`worldcup-${career.currentSeason}`, icon:"🌍🏆", title:"Campeão da Copa do Mundo", description:`Título mundial conquistado na temporada ${career.currentSeason}.`, season:career.currentSeason }] };
          updatedPlayer.reputation.international = 100;
        } else {
          wcNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"sensacionalista",
            headline:`Vice-campeões! Seleção perde a final da Copa do Mundo`,
            summary:`Derrota${isDraw?" nos pênaltis":""} para a ${pendingMatch.opponentClub.name} na decisão dói, mas a campanha entra para a história.`, date:`Temporada ${career.currentSeason}`, impact:20, season:career.currentSeason };
          updatedPlayer = addMilestone(updatedPlayer, `Vice-campeão da Copa do Mundo.`, career.currentSeason, "título");
        }
        // Fim de torneio: prêmios individuais.
        const goldenBoot = computeCupTopScorers(updatedCup, updatedPlayer, "goals");
        if(goldenBoot[0] && goldenBoot[0].isPlayer && goldenBoot[0].goals>=3){
          updatedPlayer = { ...updatedPlayer, achievements:[...updatedPlayer.achievements, { id:`wc-boot-${career.currentSeason}`, icon:"👢🥇", title:"Chuteira de Ouro da Copa do Mundo", description:`${goldenBoot[0].goals} gols na competição, artilheiro do Mundial.`, season:career.currentSeason }] };
        } else if(goldenBoot[1] && goldenBoot[1].isPlayer && goldenBoot[1].goals>=2){
          updatedPlayer = { ...updatedPlayer, achievements:[...updatedPlayer.achievements, { id:`wc-boot-silver-${career.currentSeason}`, icon:"👢🥈", title:"Chuteira de Prata da Copa do Mundo", description:`${goldenBoot[1].goals} gols na competição, vice-artilheiro do Mundial.`, season:career.currentSeason }] };
        }
      }
      if(wcNews) updatedPlayer.newsLog = [wcNews, ...updatedPlayer.newsLog].slice(0,40);
      setLastMatchResult(result);
      setCareer({ ...career, player:updatedPlayer, weekIndex:career.weekIndex+1, worldCup:updatedCup });
      setScreen("dashboard");
      return;
    }

    if(pendingMatch.isNational){
      updatedPlayer.caps = (updatedPlayer.caps||0) + 1;
      updatedPlayer.interGoals = (updatedPlayer.interGoals||0) + result.playerGoals;
      updatedPlayer.reputation.national = Math.min(100, updatedPlayer.reputation.national + (result.playerGoals>0?4:1));
      updatedPlayer.reputation.international = Math.min(100, updatedPlayer.reputation.international + (result.playerGoals>0?6:2));
      const ntNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"internacional",
        headline: result.playerGoals>0 ? `${player.firstName} marca pela seleção nacional!` : `${player.firstName} disputa mais um amistoso pela seleção`,
        summary: result.playerGoals>0 ? `${result.playerGoals} gol(s) na vitória/empate contra a ${pendingMatch.opponentClub.name}.` : `Atuação discreta no amistoso contra a ${pendingMatch.opponentClub.name}.`,
        date:`Temporada ${career.currentSeason}`, impact:result.playerGoals>0?12:4, season:career.currentSeason };
      updatedPlayer.newsLog = [ntNews, ...updatedPlayer.newsLog].slice(0,40);
      if(result.playerGoals>=2){
        updatedPlayer = addMilestone(updatedPlayer, `Marcou ${result.playerGoals} gols em um amistoso pela seleção nacional.`, career.currentSeason, "seleção");
      }
      const remaining = Math.max(0, (career.nationalTeam?.matchesRemaining||1)-1);
      const updatedNationalTeam = remaining>0 ? { ...career.nationalTeam, matchesRemaining:remaining } : null;
      setLastMatchResult(result);
      setCareer({ ...career, player:updatedPlayer, weekIndex:career.weekIndex+1, nationalTeam:updatedNationalTeam });
      setScreen("dashboard");
      return;
    }

    if(pendingMatch.isCup){
      // Gols/assistências em copa não entram na tabela da liga, mas têm que contar na carreira do jogador.
      updatedPlayer.cupGoals = (updatedPlayer.cupGoals||0) + result.playerGoals;
      updatedPlayer.cupAssists = (updatedPlayer.cupAssists||0) + result.playerAssists;
      if(pendingMatch.cupKey==="cup"){
        const cup = career.cup;
        const isDraw = result.homeGoals===result.awayGoals;
        const wonNormally = pendingMatch.isHome ? result.homeGoals>result.awayGoals : result.awayGoals>result.homeGoals;
        const wonOnPens = isDraw && shootout && shootout.winnerSide && (shootout.winnerSide==="home")===pendingMatch.isHome;
        const finalPlayerWon = wonNormally || wonOnPens || (isDraw && !shootout && Math.random()<0.5);
        let updatedCup = advanceCup(cup, finalPlayerWon, player.club, pendingMatch.opponentClub);
        updatedCup = { ...updatedCup, playerGoals:(cup.playerGoals||0)+result.playerGoals, playerAssists:(cup.playerAssists||0)+result.playerAssists };

        let cupNews;
        if(updatedCup.champion && updatedCup.champion.id===player.club.id){
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"nacional",
            headline:`CAMPEÃO! ${player.club.name} conquista a ${cup.name} com ${player.firstName} em campo`,
            summary:`Título decidido${isDraw?" nos pênaltis":""} contra o ${result.opponentClub.name}.`, date:`Temporada ${career.currentSeason}`, impact:30, season:career.currentSeason };
          updatedPlayer = addMilestone(updatedPlayer, `Campeão da ${cup.name}!`, career.currentSeason, "título");
          updatedPlayer = { ...updatedPlayer, achievements:[...updatedPlayer.achievements, { id:`cup-${cup.name}-${career.currentSeason}`, title:`Campeão da ${cup.name}`, description:`Título conquistado na temporada ${career.currentSeason}.`, season:career.currentSeason }] };
        } else if(finalPlayerWon){
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"local",
            headline:`${player.club.name} avança na ${cup.name}`,
            summary:`Vitória${isDraw?" nos pênaltis":""} sobre o ${result.opponentClub.name} garante vaga na próxima fase.`, date:`Temporada ${career.currentSeason}`, impact:10, season:career.currentSeason };
        } else {
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"sensacionalista",
            headline:`${player.club.name} é eliminado da ${cup.name}`,

        }
        if(cupNews) updatedPlayer.newsLog = [cupNews, ...updatedPlayer.newsLog].slice(0,40);
        setLastMatchResult(result);
        setCareer({ ...career, player:updatedPlayer, weekIndex:career.weekIndex+1, cup:updatedCup,
          seasonProgress:{ ...career.seasonProgress, cupGoals:career.seasonProgress.cupGoals+result.playerGoals, cupAssists:career.seasonProgress.cupAssists+result.playerAssists } });
        setScreen("dashboard");
        return;
      }

      // Copa continental: fase de grupos (empates valem ponto, sem pênaltis) + final (mata-mata puro).
      const cup = career.continentalCup;
      let updatedCup, cupNews;
      if(cup.phase==="groups"){
        updatedCup = advanceContinentalCup(cup, false, player.club, pendingMatch.opponentClub, result.homeGoals, result.awayGoals);
        updatedCup = { ...updatedCup, playerGoals:(cup.playerGoals||0)+result.playerGoals, playerAssists:(cup.playerAssists||0)+result.playerAssists };
        const wonMatch = pendingMatch.isHome ? result.homeGoals>result.awayGoals : result.awayGoals>result.homeGoals;
        const drewMatch = result.homeGoals===result.awayGoals;
        const matchVerb = wonMatch ? "Vitória" : drewMatch ? "Empate" : "Derrota";

        if(updatedCup.phase==="final"){
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"nacional",
            headline:`${player.club.name} avança à final da ${cup.name}!`,
            summary:`${matchVerb} contra o ${result.opponentClub.name} confirma a classificação em 1º ou 2º do grupo.`, date:`Temporada ${career.currentSeason}`, impact:20, season:career.currentSeason };
          updatedPlayer = addMilestone(updatedPlayer, `Classificado para a final da ${cup.name}!`, career.currentSeason, "classificação");
        } else if(updatedCup.eliminated){
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"sensacionalista",
            headline:`${player.club.name} é eliminado na fase de grupos da ${cup.name}`,
            summary:`Campanha na fase de grupos não foi suficiente para avançar na competição continental.`, date:`Temporada ${career.currentSeason}`, impact:-10, season:career.currentSeason };
        } else {
          cupNews = { id:nextNewsId(), outlet:pick(OUTLETS).name, outletType:"local",
            headline:`${matchVerb} do ${player.club.name} na fase de grupos da ${cup.name}`,

            summary:`Primeiro jogo contra o ${result.opponentClub.name}; decisão fica para o jogo de volta.`, date:`Temporada ${career.currentSeason}`, impact: wonMatch?5:drewMatch?1:-3, season:career.currentSeason };

        const isDraw = result.homeGoals===result.awayGoals;

        updatedCup = { ...updatedCup, playerGoals:(cup.playerGoals||0)+result.playerGoals, playerAssists:(cup.playerAssists||0)+result.playerAssists };
        if(finalPlayerWon){

            headline:`CAMPEÃO! ${player.club.name} conquista a ${cup.name} com ${player.firstName} em campo`,
